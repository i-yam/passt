<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Test · Modules 1–6</title>

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: #141420;
        color: #e8e8f0;
        font-family: 'Georgia', 'Times New Roman', serif;
        line-height: 1.8;
        font-size: 18px;
    }

    .container { max-width: 820px; margin: 0 auto; padding: 0 24px; }

    /* === Language toggle === */
    .lang-toggle {
        position: fixed; top: 16px; right: 16px;
        background: #2a2a44; border: 1px solid #4a4a70; border-radius: 20px;
        padding: 6px 14px; cursor: pointer; font-size: 13px;
        font-family: sans-serif; color: #a0a0d0; z-index: 100;
        transition: background 0.2s;
    }
    .lang-toggle:hover { background: #363658; }

    /* Hero */
    .hero { text-align: center; padding: 80px 24px 30px; }
    .hero h1 {
        font-size: 42px; font-weight: 700; color: #fff;
        line-height: 1.3; max-width: 700px; margin: 0 auto;
    }
    .hero .subtitle { margin-top: 16px; color: #888; font-size: 16px; font-style: italic; }

    /* Progress */
    .progress { margin: 10px 0 4px; }
    .bar { height: 6px; background: #1c1c2e; border: 1px solid #2a2a40; border-radius: 20px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: #80b4f0; width: 0; transition: width .35s ease; }
    .counter {
        margin-top: 8px; font-family: sans-serif; font-size: 13px; color: #888; text-align: right;
    }

    /* Card (shared box, matches .quiz) */
    .card {
        background: #1c1c2e; border: 1px solid #2a2a40; border-radius: 10px;
        padding: 28px; margin: 18px 0;
    }
    .qtag {
        font-family: sans-serif; font-size: 12px; letter-spacing: .12em;
        text-transform: uppercase; color: #6f6fa0; margin-bottom: 14px;
    }
    .qtext { font-size: 21px; color: #fff; line-height: 1.4; margin-bottom: 22px; }

    /* Options */
    .opt {
        display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left;
        background: #2a2a44; color: #e0e0f0; border: 1px solid #3a3a55; border-radius: 8px;
        padding: 14px 18px; margin: 10px 0; font-family: inherit; font-size: 16px;
        line-height: 1.5; cursor: pointer; transition: background 0.2s, border-color 0.2s;
    }
    .opt:hover:not(.locked) { background: #363658; border-color: #5a5a80; }
    .opt .mark {
        font-family: sans-serif; font-size: 14px; width: 26px; height: 26px; flex: 0 0 26px;
        border-radius: 6px; display: grid; place-items: center; margin-top: 1px;
        background: #1c1c2e; border: 1px solid #4a4a70; color: #a0a0d0;
    }
    .opt.locked { cursor: default; }
    .opt.correct { background: #1a4a2a; border-color: #50b878; color: #70e898; }
    .opt.correct .mark { background: #50b878; border-color: #50b878; color: #0d2417; }
    .opt.wrong { background: #2a2248; border-color: #8264dc; color: #a88ef0; }
    .opt.wrong .mark { background: #8264dc; border-color: #8264dc; color: #160f2a; }
    .opt.dim { opacity: 0.45; }

    /* Feedback / explanation */
    .explain {
        margin-top: 16px; font-size: 16px; line-height: 1.6; display: none;
        border-left: 3px solid #50b878; padding: 4px 0 4px 16px; color: #ccc;
    }
    .explain.show { display: block; }
    .explain .tag { font-family: sans-serif; font-size: 13px; color: #70e898; display: block; margin-bottom: 4px; }

    /* Open question */
    textarea {
        width: 100%; min-height: 150px; resize: vertical;
        font-family: inherit; font-size: 16px; line-height: 1.6;
        background: #141420; border: 1px solid #3a3a55; border-radius: 8px;
        padding: 14px; color: #e8e8f0; margin-bottom: 14px;
    }
    textarea:focus { outline: none; border-color: #5a5a80; }
    textarea::placeholder { color: #555; font-style: italic; }
    .model {
        margin-top: 16px; border: 1px dashed #4a4a70; background: #16162a;
        border-radius: 8px; padding: 18px 20px; display: none;
    }
    .model.show { display: block; }
    .model h4 {
        font-family: sans-serif; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
        color: #70e898; margin-bottom: 10px; font-weight: 600;
    }
    .model p { color: #ccc; margin-bottom: 12px; font-size: 16px; }
    .model p:last-child { margin-bottom: 0; }
    .model .sub { color: #a88ef0; }

    /* Buttons */
    .btn {
        font-family: inherit; font-size: 16px; cursor: pointer; border-radius: 8px;
        padding: 12px 26px; transition: background 0.2s, border-color 0.2s, opacity 0.2s;
        border: 1px solid #5a5a80; background: #3a3a60; color: #fff;
    }
    .btn:hover { background: #45456f; }
    .btn.ghost { background: transparent; border-color: #3a3a55; color: #a0a0d0; }
    .btn.ghost:hover { background: #1c1c2e; }
    .btn.reveal { background: #2a2a44; border-color: #4a4a70; color: #cfcff0; }
    .btn.reveal:hover { background: #363658; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; background: #3a3a60; }

    .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }

    /* Intro / Result panels reuse .card */
    .panel h2 { font-size: 28px; color: #fff; line-height: 1.3; margin-bottom: 18px; }
    .panel p { color: #ccc; margin-bottom: 16px; }
    .meta {
        display: flex; gap: 24px; flex-wrap: wrap; margin: 18px 0;
        font-family: sans-serif; font-size: 13px; color: #888;
    }
    .meta b { color: #e0e0f0; font-weight: 600; }
    .fine { font-size: 14px; color: #888; font-style: italic; }

    .result { text-align: center; }
    .score { font-size: 72px; color: #fff; line-height: 1; margin: 8px 0 4px; }
    .score small { color: #555; font-size: 36px; }
    .verdict { font-size: 18px; color: #ccc; margin-bottom: 6px; }

    .hidden { display: none; }

    a { color: #80b4f0; text-decoration: none; }
    a:hover { text-decoration: underline; }

    footer { text-align: center; padding: 40px 24px; color: #444; font-size: 14px; }

    @media (max-width: 680px) {
        .hero h1 { font-size: 28px; }
        body { font-size: 16px; }
        .qtext { font-size: 19px; }
        .panel h2 { font-size: 24px; }
        .score { font-size: 56px; }
    }
</style>
</head>
<body>

<button class="lang-toggle" onclick="toggleLang()">DE</button>

<!-- Hero -->
<div class="hero">
    <h1 data-i18n="title">Self-Test</h1>
    <p class="subtitle" data-i18n="hook">Modules 1 to 6. Fourteen multiple-choice questions and two open ones. One at a time.</p>
</div>

<div class="container">

  <!-- INTRO -->
  <section id="intro" class="card panel">
    <h2 data-i18n="iH">Instructions</h2>
    <p data-i18n="iP1"></p>
    <div class="meta">
      <span><b data-i18n="iM1"></b></span>
      <span><b data-i18n="iM2"></b></span>
      <span><b data-i18n="iM3"></b></span>
    </div>
    <p class="fine" data-i18n="iP2"></p>
    <div class="nav" style="justify-content:flex-end">
      <button class="btn" id="i-start" onclick="start()" data-i18n="start">Begin</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="progress">
      <div class="bar"><i id="prog"></i></div>
      <div class="counter" id="counter"></div>
    </div>
    <div class="card" id="card"></div>
    <div class="nav">
      <button class="btn ghost" id="prev" onclick="go(-1)" data-i18n="prev">Back</button>
      <button class="btn" id="next" onclick="go(1)" disabled data-i18n="next">Next</button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="card panel result hidden">
    <h2 id="r-h"></h2>
    <div class="score"><span id="r-score">0</span><small>/14</small></div>
    <p class="verdict" id="r-verdict"></p>
    <p class="fine" id="r-note"></p>
    <div class="nav" style="justify-content:center;margin-top:22px">
      <button class="btn ghost" id="r-review" onclick="review()"></button>
      <button class="btn" id="r-restart" onclick="restart()"></button>
    </div>
  </section>

</div>

<footer><span id="foot"></span></footer>

  de:{q:"Die Genauigkeit (Accuracy) als Klassifikationsmetrik kann irref\u00fchrend sein, wenn:",
      o:["die Klassen im Datensatz ausgewogen sind.","die Klassen im Datensatz stark unausgewogen sind.","das Modell zu wenige Merkmale verwendet.","die Entscheidungsgrenze exakt linear ist."],
      e:"Bei stark unausgewogenen Klassen liefert das Vorhersagen der Mehrheitsklasse hohe Genauigkeit und sagt nichts. 95 % Accuracy bei 95 % Negativen ist das \u201eimmer Nein\u201c-Modell."} }
];

const OPEN = [
{ en:{q:"Explain the difference between deduction and induction. Give a short example of each from outside computer science. Which of the two underlies most of statistical machine learning, and why?",
      model:[
        ["","Deduction reasons from a general rule to a specific case. If the rule holds, the conclusion is certain. Example: all mammals breathe air; a whale is a mammal; therefore a whale breathes air."],
        ["","Induction reasons from specific observations to a general rule. The conclusion is probable, not guaranteed. Example: every winter so far has been cold, so the next one will probably be cold too."],
        ["Induction.","Most statistical machine learning is inductive. The model sees a finite sample of examples and infers a general rule meant to hold on data it has never seen. That is exactly why it can be wrong on new data."]
      ]},
  de:{q:"Erl\u00e4utern Sie den Unterschied zwischen Deduktion und Induktion. Geben Sie f\u00fcr beide jeweils ein kurzes Beispiel au\u00dferhalb der Informatik an. Welches der beiden Verfahren liegt dem Gro\u00dfteil des statistischen maschinellen Lernens zugrunde, und warum?",
      model:[
        ["","Deduktion schlie\u00dft von einer allgemeinen Regel auf einen konkreten Fall. Ist die Regel wahr, ist die Schlussfolgerung sicher. Beispiel: Alle S\u00e4ugetiere atmen Luft; ein Wal ist ein S\u00e4ugetier; also atmet ein Wal Luft."],
        ["","Induktion schlie\u00dft von konkreten Beobachtungen auf eine allgemeine Regel. Die Schlussfolgerung ist wahrscheinlich, nicht garantiert. Beispiel: Jeder bisherige Winter war kalt, also wird der n\u00e4chste wahrscheinlich auch kalt."],
        ["Induktion.","Der Gro\u00dfteil des statistischen maschinellen Lernens ist induktiv. Das Modell sieht eine endliche Stichprobe von Beispielen und leitet daraus eine allgemeine Regel ab, die auf nie gesehenen Daten gelten soll. Genau deshalb kann es bei neuen Daten falsch liegen."]
      ]} },

{ en:{q:"You train a regression model with 200 input features on a dataset of 100 observations. The training error is near zero, the test error is large. (a) Name and explain the phenomenon. (b) How do ridge (L2) and lasso (L1) react differently here? (c) Which would you choose if you also want to identify the small subset of truly relevant features, and why?",
      model:[
        ["(a) Overfitting.","With 200 features and 100 observations the model has more freedom than data. It fits the noise in the training set and learns nothing that transfers. Training error collapses while test error stays high."],
        ["(b) Ridge vs lasso.","Ridge (L2) shrinks all coefficients toward zero but keeps every feature, spreading weight across correlated ones. Lasso (L1) can drive coefficients exactly to zero, removing features entirely and producing a sparse model."],
        ["(c) Lasso.","Zeroing coefficients performs feature selection and hands you the small subset it kept as the relevant features. Ridge would shrink everything but identify nothing."]
      ]},
  de:{q:"Sie trainieren ein Regressionsmodell mit 200 Eingabemerkmalen auf einem Datensatz von 100 Beobachtungen. Der Trainingsfehler liegt nahe null, der Testfehler ist gro\u00df. (a) Benennen und erkl\u00e4ren Sie das Ph\u00e4nomen. (b) Wie reagieren Ridge (L2) und Lasso (L1) hier jeweils unterschiedlich? (c) Welche w\u00fcrden Sie w\u00e4hlen, wenn Sie zus\u00e4tzlich die kleine Teilmenge der wirklich relevanten Merkmale identifizieren m\u00f6chten, und warum?",
      model:[
        ["(a) \u00dcberanpassung (Overfitting).","Bei 200 Merkmalen und 100 Beobachtungen hat das Modell mehr Freiheitsgrade als Daten. Es passt sich dem Rauschen der Trainingsdaten an und lernt nichts \u00dcbertragbares. Der Trainingsfehler geht gegen null, der Testfehler bleibt gro\u00df."],
        ["(b) Ridge gegen Lasso.","Ridge (L2) verkleinert alle Koeffizienten in Richtung null, beh\u00e4lt aber jedes Merkmal und verteilt Gewicht \u00fcber korrelierte Merkmale. Lasso (L1) kann Koeffizienten exakt auf null setzen, entfernt Merkmale vollst\u00e4ndig und erzeugt ein d\u00fcnn besetztes Modell."],
        ["(c) Lasso.","Das Nullsetzen der Koeffizienten bewirkt eine Merkmalsauswahl und weist genau die kleine Teilmenge der behaltenen Merkmale als relevant aus. Ridge w\u00fcrde alles verkleinern, aber nichts identifizieren."]
      ]} }
];

/* ---------------- state ---------------- */
let lang = "en";
let idx = 0;
const TOTAL = MC.length + OPEN.length;
const answers = new Array(MC.length).fill(null);
const opened  = new Array(OPEN.length).fill(false);
const openText = ["",""];
const $ = id => document.getElementById(id);
const LET = ["a","b","c","d"];

function toggleLang(){
  lang = lang === "en" ? "de" : "en";
  document.documentElement.lang = lang;
  document.querySelector(".lang-toggle").textContent = lang === "en" ? "DE" : "EN";
  paintStatic();
  if(!$("quiz").classList.contains("hidden")) render();
  if(!$("result").classList.contains("hidden")) showResult();
  typeset();
}

function paintStatic(){
  const t = T[lang];
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if(t[k]!==undefined && typeof t[k]==="string") el.textContent = t[k];
  });
  $("prev").textContent = t.prev;
  $("r-review").textContent = t.review;
  $("r-restart").textContent = t.restart;
  $("foot").textContent = t.foot;
}

function start(){
  $("intro").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  idx = 0; render();
}

function render(){
  const t = T[lang];
  $("prog").style.width = (idx/TOTAL*100) + "%";
  $("prev").disabled = idx===0;
  if(idx < MC.length) renderMC(idx);
  else renderOpen(idx - MC.length);
  $("next").textContent = (idx === TOTAL-1) ? t.finish : t.next;
  typeset();
}

function renderMC(i){
  const t = T[lang], d = MC[i][lang], c = MC[i].correct, done = answers[i]!==null;
  $("counter").textContent = t.counterMC(i+1);
  let html = `<div class="qtag">${t.counterMC(i+1)}</div><div class="qtext">${d.q}</div>`;
  d.o.forEach((opt,k)=>{
    let cls = "opt";
    if(done){ cls += " locked";
      if(k===c) cls += " correct";
      else if(k===answers[i]) cls += " wrong";
      else cls += " dim";
    }
    html += `<button class="${cls}" onclick="pick(${i},${k})"><span class="mark">${LET[k]}</span><span>${opt}</span></button>`;
  });
  html += `<div class="explain${done?' show':''}"><span class="tag">${t.correctLabel}: ${LET[c]}</span>${d.e}</div>`;
  $("card").innerHTML = html;
  $("next").disabled = !done;
}

function pick(i,k){
  if(answers[i]!==null) return;
  answers[i] = k;
  renderMC(i); typeset();
}

function renderOpen(j){
  const t = T[lang], d = OPEN[j][lang], shown = opened[j];
  $("counter").textContent = t.counterOpen(j+1);
  let model = `<div class="model${shown?' show':''}"><h4>${t.modelTitle}</h4>`;
  d.model.forEach(p=>{ model += `<p>${p[0]?`<span class="sub">${p[0]}</span> `:''}${p[1]}</p>`; });
  model += `</div>`;
  $("card").innerHTML =
    `<div class="qtag">${t.counterOpen(j+1)}</div>`+
    `<div class="qtext">${d.q}</div>`+
    `<textarea id="ta${j}" placeholder="${t.yourAnswer}\u2026" oninput="saveTA(${j})">${openText[j]||""}</textarea>`+
    `<button class="btn reveal" onclick="reveal(${j})">${t.reveal}</button>`+
    model;
  $("next").disabled = false;
}

function saveTA(j){ openText[j] = $("ta"+j).value; }
function reveal(j){ opened[j]=true; saveTA(j); renderOpen(j); typeset(); }

function go(dir){
  const j = idx - MC.length;
  if(j>=0 && $("ta"+j)) openText[j] = $("ta"+j).value;
  if(dir>0 && idx===TOTAL-1){ finish(); return; }
  idx = Math.max(0, Math.min(TOTAL-1, idx+dir));
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function finish(){
  $("prog").style.width = "100%";
  $("quiz").classList.add("hidden");
  showResult();
}

function showResult(){
  const t = T[lang];
  const score = answers.reduce((s,a,i)=> s + (a===MC[i].correct?1:0), 0);
  $("result").classList.remove("hidden");
  $("r-h").textContent = t.rH;
  $("r-score").textContent = score;
  $("r-verdict").textContent = t.verdict(score);
  $("r-note").textContent = t.rNote;
}

function review(){
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  idx = 0; render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function restart(){
  answers.fill(null); opened.fill(false); openText[0]=""; openText[1]="";
  $("result").classList.add("hidden");
  $("quiz").classList.add("hidden");
  $("intro").classList.remove("hidden");
  $("prog").style.width = "0%";
  window.scrollTo({top:0,behavior:"smooth"});
}

function typeset(){
  if(window.renderMathInElement){
    renderMathInElement(document.body,{
      delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],
      throwOnError:false
    });
  }
}

window.addEventListener("load",()=>{ paintStatic(); typeset(); });
</script>
</body>
</html>
