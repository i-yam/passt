<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: #141420;
        color: #e8e8f0;
        font-family: 'Georgia', 'Times New Roman', serif;
        line-height: 1.8;
        font-size: 18px;
    }

    .container { max-width: 820px; margin: 0 auto; padding: 0 24px; }

    /* === Language toggle === */
    .lang-toggle {
        position: fixed; top: 16px; right: 16px;
        background: #2a2a44; border: 1px solid #4a4a70; border-radius: 20px;
        padding: 6px 14px; cursor: pointer; font-size: 13px;
        font-family: sans-serif; color: #a0a0d0; z-index: 100;
        transition: background 0.2s;
    }
    .lang-toggle:hover { background: #363658; }

    /* Hero */
    .hero { text-align: center; padding: 80px 24px 30px; }
    .hero h1 {
        font-size: 42px; font-weight: 700; color: #fff;
        line-height: 1.3; max-width: 700px; margin: 0 auto;
    }
    .hero .subtitle { margin-top: 16px; color: #888; font-size: 16px; font-style: italic; }

    /* Progress */
    .progress { margin: 10px 0 4px; }
    .bar { height: 6px; background: #1c1c2e; border: 1px solid #2a2a40; border-radius: 20px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: #80b4f0; width: 0; transition: width .35s ease; }
    .counter {
        margin-top: 8px; font-family: sans-serif; font-size: 13px; color: #888; text-align: right;
    }

    /* Card (shared box, matches .quiz) */
    .card {
        background: #1c1c2e; border: 1px solid #2a2a40; border-radius: 10px;
        padding: 28px; margin: 18px 0;
    }
    .qtag {
        font-family: sans-serif; font-size: 12px; letter-spacing: .12em;
        text-transform: uppercase; color: #6f6fa0; margin-bottom: 14px;
    }
    .qtext { font-size: 21px; color: #fff; line-height: 1.4; margin-bottom: 22px; }

    /* Options */
    .opt {
        display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left;
        background: #2a2a44; color: #e0e0f0; border: 1px solid #3a3a55; border-radius: 8px;
        padding: 14px 18px; margin: 10px 0; font-family: inherit; font-size: 16px;
        line-height: 1.5; cursor: pointer; transition: background 0.2s, border-color 0.2s;
    }
    .opt:hover:not(.locked) { background: #363658; border-color: #5a5a80; }
    .opt .mark {
        font-family: sans-serif; font-size: 14px; width: 26px; height: 26px; flex: 0 0 26px;
        border-radius: 6px; display: grid; place-items: center; margin-top: 1px;
        background: #1c1c2e; border: 1px solid #4a4a70; color: #a0a0d0;
    }
    .opt.locked { cursor: default; }
    .opt.correct { background: #1a4a2a; border-color: #50b878; color: #70e898; }
    .opt.correct .mark { background: #50b878; border-color: #50b878; color: #0d2417; }
    .opt.wrong { background: #2a2248; border-color: #8264dc; color: #a88ef0; }
    .opt.wrong .mark { background: #8264dc; border-color: #8264dc; color: #160f2a; }
    .opt.dim { opacity: 0.45; }

    /* Feedback / explanation */
    .explain {
        margin-top: 16px; font-size: 16px; line-height: 1.6; display: none;
        border-left: 3px solid #50b878; padding: 4px 0 4px 16px; color: #ccc;
    }
    .explain.show { display: block; }
    .explain .tag { font-family: sans-serif; font-size: 13px; color: #70e898; display: block; margin-bottom: 4px; }

    /* Buttons */
    .btn {
        font-family: inherit; font-size: 16px; cursor: pointer; border-radius: 8px;
        padding: 12px 26px; transition: background 0.2s, border-color 0.2s, opacity 0.2s;
        border: 1px solid #5a5a80; background: #3a3a60; color: #fff;
    }
    .btn:hover { background: #45456f; }
    .btn.ghost { background: transparent; border-color: #3a3a55; color: #a0a0d0; }
    .btn.ghost:hover { background: #1c1c2e; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; background: #3a3a60; }

    .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }

    /* Intro / Result panels reuse .card */
    .panel h2 { font-size: 28px; color: #fff; line-height: 1.3; margin-bottom: 18px; }
    .panel p { color: #ccc; margin-bottom: 16px; }
    .meta {
        display: flex; gap: 24px; flex-wrap: wrap; margin: 18px 0;
        font-family: sans-serif; font-size: 13px; color: #888;
    }
    .meta b { color: #e0e0f0; font-weight: 600; }
    .fine { font-size: 14px; color: #888; font-style: italic; }

    .download {
        display: inline-flex; align-items: center; gap: 10px; margin: 4px 0 18px;
        font-family: sans-serif; font-size: 14px; color: #80b4f0;
        border: 1px solid #2a2a40; background: #16162a; border-radius: 8px;
        padding: 12px 18px; transition: background 0.2s, border-color 0.2s;
    }
    .download:hover { background: #1c1c2e; border-color: #3a3a55; text-decoration: none; }
    .download .ic { font-style: normal; }

    .result { text-align: center; }
    .score { font-size: 72px; color: #fff; line-height: 1; margin: 8px 0 4px; }
    .score small { color: #555; font-size: 36px; }
    .verdict { font-size: 18px; color: #ccc; margin-bottom: 6px; }

    .hidden { display: none; }

    a { color: #80b4f0; text-decoration: none; }
    a:hover { text-decoration: underline; }

    footer { text-align: center; padding: 40px 24px; color: #444; font-size: 14px; }

    @media (max-width: 680px) {
        .hero h1 { font-size: 28px; }
        body { font-size: 16px; }
        .qtext { font-size: 19px; }
        .panel h2 { font-size: 24px; }
        .score { font-size: 56px; }
    }
</style>
</head>

<!-- Hero -->
<div class="hero">
    <h1 data-i18n="title">Exam Practice</h1>

</div>

<div class="container">

  <!-- INTRO -->
  <section id="intro" class="card panel">

    <p data-i18n="iP1"></p>
    <a class="download" id="dl" href="exam_questions.md" download>
      <i class="ic">&#8595;</i><span data-i18n="dl"></span>
    </a>
    <div class="meta">
      <span><b data-i18n="iM1"></b></span>

    <div class="nav" style="justify-content:flex-end">
      <button class="btn" id="i-start" onclick="start()" data-i18n="start">Begin</button>
    </div>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="progress">

  <!-- RESULT -->

    <div class="nav" style="justify-content:center;margin-top:22px">
      <button class="btn ghost" id="r-review" onclick="review()"></button>
      <button class="btn" id="r-restart" onclick="restart()"></button>
    </div>
  </section>

</div>

<script>
const MC = [{"correct": 1, "en": {"q": "In his 1950 paper, Alan Turing asked whether:", "o": ["machines can carry out arithmetic faster and more reliably than any human.", "machines can think.", "machines can build copies of themselves without any human help.", "machines can possess genuine subjective conscious experience."], "e": "Turing opens with “Can machines think?” and then replaces it with the imitation game."}, "de": {"q": "In seinem Aufsatz von 1950 fragte Alan Turing, ob:", "o": ["Maschinen schneller und zuverlässiger rechnen können als jeder Mensch.", "Maschinen denken können.", "Maschinen ohne jede menschliche Hilfe Kopien von sich selbst bauen können.", "Maschinen ein echtes subjektives Bewusstsein besitzen können."], "e": "Turing beginnt mit „Kann eine Maschine denken?“ und ersetzt die Frage dann durch das Imitationsspiel."}}, {"correct": 1, "en": {"q": "Karl Popper’s falsifiability criterion states that a scientific claim:", "o": ["must be confirmed by a long series of carefully repeated experiments.", "must in principle be refutable by observation.", "must be stated in a precise and fully formal mathematical language.", "must be endorsed by a clear majority of recognized domain experts."], "e": "A claim is scientific only if some observation could in principle prove it wrong."}, "de": {"q": "Karl Poppers Falsifizierbarkeitskriterium besagt, dass eine wissenschaftliche Aussage:", "o": ["durch eine lange Reihe sorgfältig wiederholter Experimente bestätigt werden muss.", "im Prinzip durch Beobachtung widerlegbar sein muss.", "in einer präzisen und vollständig formalen mathematischen Sprache formuliert sein muss.", "von einer klaren Mehrheit anerkannter Fachleute befürwortet sein muss."], "e": "Eine Aussage ist nur dann wissenschaftlich, wenn eine Beobachtung sie im Prinzip widerlegen könnte."}}, {"correct": 2, "en": {"q": "“Strong AI” in the sense of Class 1 refers to:", "o": ["a model that has been trained on an unusually large and varied dataset.", "any system built out of many billions of tunable internal parameters.", "a system with general cognitive ability comparable to a human.", "a model that surpasses human scores on one narrow benchmark task."], "e": "Strong AI means general intelligence across domains. Model size or one benchmark win is not it."}, "de": {"q": "„Starke KI“ im Sinne von Klasse 1 bezeichnet:", "o": ["ein Modell, das auf einem ungewöhnlich großen und vielfältigen Datensatz trainiert wurde.", "jedes System, das aus vielen Milliarden einstellbarer interner Parameter besteht.", "ein System mit allgemeiner kognitiver Fähigkeit, vergleichbar mit der eines Menschen.", "ein Modell, das Menschen in einer einzelnen, engen Benchmark-Aufgabe übertrifft."], "e": "Starke KI meint allgemeine Intelligenz über Bereiche hinweg. Modellgröße oder ein einzelner Benchmark-Sieg sind es nicht."}}, {"correct": 1, "en": {"q": "A theory that can explain every possible outcome, no matter what happens, is:", "o": ["the strongest possible kind of scientific theory, since nothing escapes it.", "not falsifiable, and so not scientific in Popper’s sense.", "clearly falsifiable, precisely because it manages to cover every case.", "acceptable as science only when it is expressed in statistical terms."], "e": "If no observation could ever contradict it, it predicts nothing and cannot be tested."}, "de": {"q": "Eine Theorie, die jeden möglichen Ausgang erklären kann, egal was passiert, ist:", "o": ["die stärkstmögliche Art wissenschaftlicher Theorie, da ihr nichts entgeht.", "nicht falsifizierbar und damit nicht wissenschaftlich im Sinne Poppers.", "eindeutig falsifizierbar, gerade weil sie jeden Fall abdeckt.", "nur dann als Wissenschaft akzeptabel, wenn sie in statistischen Begriffen ausgedrückt wird."], "e": "Wenn keine Beobachtung ihr je widersprechen könnte, sagt sie nichts vorher und lässt sich nicht prüfen."}}, {"correct": 0, "en": {"q": "In supervised learning, the training data consists of:", "o": ["inputs paired with known correct outputs.", "inputs supplied on their own, with no target labels attached.", "a stream of rewards and penalties collected from an environment.", "a set of hand-written if-then rules supplied by a domain expert."], "e": "Supervised learning learns a mapping from labeled examples."}, "de": {"q": "Beim überwachten Lernen bestehen die Trainingsdaten aus:", "o": ["Eingaben, die mit bekannten korrekten Ausgaben gepaart sind.", "Eingaben allein, ohne angehängte Zielmarkierungen.", "einem Strom von Belohnungen und Strafen, gesammelt aus einer Umgebung.", "einer Menge handgeschriebener Wenn-Dann-Regeln von einem Fachexperten."], "e": "Überwachtes Lernen lernt eine Abbildung aus markierten Beispielen."}}, {"correct": 2, "en": {"q": "Unsupervised learning is characterized by:", "o": ["a reward signal that tells the model how good each chosen action was.", "labeled training examples that are provided to the model in advance.", "finding structure in data with no labels.", "a fixed collection of decision rules written out by a human expert."], "e": "Clustering and dimensionality reduction work on unlabeled data."}, "de": {"q": "Unüberwachtes Lernen ist gekennzeichnet durch:", "o": ["ein Belohnungssignal, das dem Modell sagt, wie gut jede gewählte Aktion war.", "markierte Trainingsbeispiele, die dem Modell im Voraus bereitgestellt werden.", "das Finden von Struktur in Daten ohne Markierungen.", "eine feste Sammlung von Entscheidungsregeln, ausformuliert von einem menschlichen Experten."], "e": "Clustering und Dimensionsreduktion arbeiten mit nicht markierten Daten."}}, {"correct": 1, "en": {"q": "Reinforcement learning differs from supervised learning because the model:", "o": ["requires absolutely no data of any kind in order to learn its task.", "learns from rewards and penalties received by acting, not from labeled examples.", "is by its nature always non-parametric rather than parametric.", "is fundamentally unable to be trained using any form of gradient descent."], "e": "The agent learns a policy through trial and feedback from an environment."}, "de": {"q": "Bestärkendes Lernen unterscheidet sich vom überwachten Lernen, weil das Modell:", "o": ["überhaupt keine Daten irgendeiner Art benötigt, um seine Aufgabe zu lernen.", "aus Belohnungen und Strafen lernt, die es durch Handeln erhält, nicht aus markierten Beispielen.", "seiner Natur nach immer nicht-parametrisch statt parametrisch ist.", "grundsätzlich nicht mit irgendeiner Form von Gradientenabstieg trainiert werden kann."], "e": "Der Agent lernt eine Strategie durch Versuch und Rückmeldung aus einer Umgebung."}}, {"correct": 1, "en": {"q": "A pocket calculator is generally not considered AI because it:", "o": ["operates far too quickly for its behavior to count as intelligent.", "follows fixed rules and learns nothing from data.", "has no way to connect to the internet or any outside resource.", "is restricted to working with whole numbers and integer arithmetic."], "e": "A calculator executes a fixed procedure. It does not learn or adapt."}, "de": {"q": "Ein Taschenrechner gilt im Allgemeinen nicht als KI, weil er:", "o": ["viel zu schnell arbeitet, als dass sein Verhalten als intelligent gelten könnte.", "festen Regeln folgt und nichts aus Daten lernt.", "keine Möglichkeit hat, sich mit dem Internet oder einer externen Ressource zu verbinden.", "auf das Arbeiten mit ganzen Zahlen und Ganzzahlarithmetik beschränkt ist."], "e": "Ein Taschenrechner führt ein festes Verfahren aus. Er lernt nicht und passt sich nicht an."}}, {"correct": 0, "en": {"q": "Deduction proceeds:", "o": ["from general rules to specific cases.", "from a set of specific observed cases up to a general rule.", "from raw observation toward the fitting of a statistical model.", "from an input to an output by way of repeated random sampling."], "e": "Deduction goes rule to case. If the rule holds, the conclusion is certain."}, "de": {"q": "Deduktion verläuft:", "o": ["von allgemeinen Regeln zu konkreten Fällen.", "von einer Menge konkret beobachteter Fälle hinauf zu einer allgemeinen Regel.", "von der reinen Beobachtung hin zur Anpassung eines statistischen Modells.", "von einer Eingabe zu einer Ausgabe durch wiederholte Zufallsstichproben."], "e": "Deduktion geht von der Regel zum Fall. Ist die Regel wahr, ist die Schlussfolgerung sicher."}}, {"correct": 1, "en": {"q": "Induction proceeds:", "o": ["from a stated general rule down to a particular specific case.", "from specific observations to a general rule.", "from a formal mathematical proof toward its logical conclusion.", "from a produced output backward to the input that caused it."], "e": "Induction generalizes from examples. The conclusion is probable, not guaranteed."}, "de": {"q": "Induktion verläuft:", "o": ["von einer formulierten allgemeinen Regel hinab zu einem bestimmten konkreten Fall.", "von konkreten Beobachtungen zu einer allgemeinen Regel.", "von einem formalen mathematischen Beweis hin zu seiner logischen Schlussfolgerung.", "von einer erzeugten Ausgabe zurück zur Eingabe, die sie verursacht hat."], "e": "Induktion verallgemeinert aus Beispielen. Die Schlussfolgerung ist wahrscheinlich, nicht garantiert."}}, {"correct": 1, "en": {"q": "Most statistical machine learning is inductive because the model:", "o": ["is proven to be correct in advance, before it has seen any data at all.", "infers a general rule from a finite sample, meant to hold on unseen data.", "is guaranteed never to make a single mistake when faced with new data.", "does nothing more than memorize the exact contents of the training set."], "e": "It generalizes from a sample, which is exactly why it can be wrong on new data."}, "de": {"q": "Das meiste statistische maschinelle Lernen ist induktiv, weil das Modell:", "o": ["im Voraus als korrekt bewiesen ist, bevor es überhaupt Daten gesehen hat.", "aus einer endlichen Stichprobe eine allgemeine Regel ableitet, die auf ungesehenen Daten gelten soll.", "garantiert nie einen einzigen Fehler macht, wenn es auf neue Daten trifft.", "nichts weiter tut, als den genauen Inhalt der Trainingsdaten auswendig zu lernen."], "e": "Es verallgemeinert aus einer Stichprobe, und genau deshalb kann es bei neuen Daten falsch liegen."}}, {"correct": 1, "en": {"q": "Classic rule-based expert systems hit a wall mainly because:", "o": ["the computers of the era were simply not fast enough to run them.", "hand-coding and maintaining the rules is expensive and brittle.", "they had no mechanism for storing any knowledge whatsoever.", "such systems were prohibited by law across the European Union."], "e": "Every rule must be written and maintained by hand, and exceptions multiply fast."}, "de": {"q": "Klassische regelbasierte Expertensysteme stießen vor allem deshalb an eine Grenze, weil:", "o": ["die Computer der damaligen Zeit schlicht nicht schnell genug waren, um sie auszuführen.", "das Kodieren und Pflegen der Regeln von Hand teuer und brüchig ist.", "sie über keinerlei Mechanismus zum Speichern von Wissen verfügten.", "solche Systeme in der gesamten Europäischen Union gesetzlich verboten waren."], "e": "Jede Regel muss von Hand geschrieben und gepflegt werden, und die Ausnahmen vermehren sich schnell."}}, {"correct": 1, "en": {"q": "Anscombe’s Quartet shows that:", "o": ["four different regression models can fit a single dataset about equally well.", "summary statistics can be identical for datasets of very different shape.", "linear regression has no way of coping with outliers in the data.", "a strong correlation between variables does not establish causation."], "e": "Four datasets share mean, variance, correlation and regression line, yet look nothing alike."}, "de": {"q": "Anscombes Quartett zeigt, dass:", "o": ["vier verschiedene Regressionsmodelle einen einzigen Datensatz etwa gleich gut anpassen können.", "Kennzahlen für Datensätze sehr unterschiedlicher Form identisch sein können.", "lineare Regression keine Möglichkeit hat, mit Ausreißern in den Daten umzugehen.", "eine starke Korrelation zwischen Variablen keine Kausalität begründet."], "e": "Vier Datensätze teilen Mittelwert, Varianz, Korrelation und Regressionsgerade, sehen aber völlig verschieden aus."}}, {"correct": 0, "en": {"q": "A semantic network or ontology is an example of:", "o": ["explicit knowledge representation, where facts and relations are coded by hand.", "a deep neural network built from many stacked, trainable hidden layers.", "an unsupervised method that clusters unlabeled data into similar groups.", "a reinforcement learning policy learned from rewards in an environment."], "e": "These encode knowledge as nodes and labeled links, defined in advance by humans."}, "de": {"q": "Ein semantisches Netz oder eine Ontologie ist ein Beispiel für:", "o": ["explizite Wissensrepräsentation, bei der Fakten und Beziehungen von Hand kodiert werden.", "ein tiefes neuronales Netz aus vielen gestapelten, trainierbaren verborgenen Schichten.", "ein unüberwachtes Verfahren, das nicht markierte Daten in ähnliche Gruppen clustert.", "eine durch Belohnungen in einer Umgebung gelernte Strategie des bestärkenden Lernens."], "e": "Diese kodieren Wissen als Knoten und beschriftete Verbindungen, von Menschen im Voraus festgelegt."}}, {"correct": 2, "en": {"q": "Statistical learning displaced hand-coded rule systems mainly because it:", "o": ["manages to work effectively without requiring any training data or labeled examples at all.", "is in every single case fully transparent and easy to interpret.", "learns patterns directly from data instead of relying on enumerated rules.", "is structurally incapable of ever overfitting the training data."], "e": "Let the data define the rules, and you stop writing them one by one."}, "de": {"q": "Statistisches Lernen verdrängte handkodierte Regelsysteme vor allem, weil es:", "o": ["wirksam arbeitet, ohne überhaupt Trainingsdaten oder markierte Beispiele zu benötigen.", "in jedem einzelnen Fall vollständig transparent und leicht zu interpretieren ist.", "Muster direkt aus Daten lernt, statt sich auf aufgezählte Regeln zu stützen.", "strukturell unfähig ist, die Trainingsdaten jemals zu überanpassen."], "e": "Lass die Daten die Regeln festlegen, und du hörst auf, sie einzeln zu schreiben."}}, {"correct": 1, "en": {"q": "The practical lesson of Anscombe’s Quartet for a working analyst is:", "o": ["trust the correlation coefficient ahead of any visual plot of the data.", "plot the data before trusting any summary statistic.", "default to a linear model regardless of what the data looks like.", "strip out every outlier from the data before doing anything else."], "e": "Statistical similarity is not similarity. Look at the data."}, "de": {"q": "Die praktische Lehre aus Anscombes Quartett für eine arbeitende Analystin ist:", "o": ["dem Korrelationskoeffizienten mehr zu vertrauen als jeder visuellen Darstellung der Daten.", "die Daten zu plotten, bevor man irgendeiner Kennzahl vertraut.", "standardmäßig ein lineares Modell zu nehmen, egal wie die Daten aussehen.", "jeden Ausreißer aus den Daten zu entfernen, bevor man irgendetwas anderes tut."], "e": "Statistische Ähnlichkeit ist keine Ähnlichkeit. Schau dir die Daten an."}}, {"correct": 0, "en": {"q": "Ordinary least squares (OLS) for linear regression yields:", "o": ["a closed-form analytic solution.", "only an approximate answer obtained through repeated iteration.", "a probabilistic output bounded between zero and one.", "exactly the same result as K-NN run with K equal to one."], "e": "OLS solves the normal equations directly. No iteration needed."}, "de": {"q": "Die Methode der kleinsten Quadrate (OLS) für die lineare Regression liefert:", "o": ["eine geschlossene analytische Lösung.", "nur eine Näherung, die durch wiederholte Iteration gewonnen wird.", "eine probabilistische Ausgabe, begrenzt zwischen null und eins.", "genau dasselbe Ergebnis wie K-NN mit K gleich eins."], "e": "OLS löst die Normalengleichungen direkt. Keine Iteration nötig."}}, {"correct": 1, "en": {"q": "Stochastic gradient descent updates the parameters:", "o": ["using the gradient computed over the entire training set at every step.", "using the gradient from a single sample or a small batch per step.", "without making any use of gradients during the update at all.", "only after the loss has already been driven all the way to zero."], "e": "The full dataset per step is batch gradient descent. SGD uses one sample or a mini-batch."}, "de": {"q": "Stochastischer Gradientenabstieg aktualisiert die Parameter:", "o": ["mithilfe des über den gesamten Trainingsdatensatz berechneten Gradienten bei jedem Schritt.", "mithilfe des Gradienten aus einer einzelnen Stichprobe oder einem kleinen Batch pro Schritt.", "ganz ohne irgendeine Verwendung von Gradienten bei der Aktualisierung.", "erst, nachdem der Verlust bereits ganz auf null gebracht wurde."], "e": "Der ganze Datensatz pro Schritt ist Batch-Gradientenabstieg. SGD nutzt eine Stichprobe oder einen Mini-Batch."}}, {"correct": 1, "en": {"q": "The loss function in linear regression measures:", "o": ["the total count of input features included in the model.", "how far the model’s predictions sit from the actual values.", "the size of the learning rate used during gradient descent.", "the number of training steps taken before the model converged."], "e": "Mean squared error sums the squared gaps between prediction and truth."}, "de": {"q": "Die Verlustfunktion in der linearen Regression misst:", "o": ["die Gesamtzahl der im Modell enthaltenen Eingabemerkmale.", "wie weit die Vorhersagen des Modells von den tatsächlichen Werten entfernt liegen.", "die Größe der beim Gradientenabstieg verwendeten Lernrate.", "die Anzahl der Trainingsschritte bis zur Konvergenz des Modells."], "e": "Der mittlere quadratische Fehler summiert die quadrierten Abstände zwischen Vorhersage und Wahrheit."}}, {"correct": 1, "en": {"q": "Gradient descent moves the weights:", "o": ["in the same direction as the gradient, which raises the loss.", "in the direction opposite the gradient, to decrease the loss.", "in random directions until the loss happens to drop a little.", "strictly along one fixed axis chosen ahead of time."], "e": "The negative gradient points downhill on the loss surface."}, "de": {"q": "Der Gradientenabstieg bewegt die Gewichte:", "o": ["in dieselbe Richtung wie der Gradient, was den Verlust erhöht.", "in die dem Gradienten entgegengesetzte Richtung, um den Verlust zu senken.", "in zufällige Richtungen, bis der Verlust zufällig etwas sinkt.", "streng entlang einer einzigen, im Voraus gewählten Achse."], "e": "Der negative Gradient zeigt bergab auf der Verlustfläche."}}, {"correct": 1, "en": {"q": "A residual in a regression model is:", "o": ["the slope of the straight line that the model has fitted.", "the difference between an observed value and the model’s prediction.", "the learning rate multiplied by the current gradient value.", "the total number of features the model was given to use."], "e": "Residual equals observed minus predicted. Residual plots reveal where the model fails."}, "de": {"q": "Ein Residuum in einem Regressionsmodell ist:", "o": ["die Steigung der Geraden, die das Modell angepasst hat.", "die Differenz zwischen einem beobachteten Wert und der Vorhersage des Modells.", "die Lernrate multipliziert mit dem aktuellen Gradientenwert.", "die Gesamtzahl der Merkmale, die dem Modell zur Verfügung standen."], "e": "Residuum gleich beobachtet minus vorhergesagt. Residuenplots zeigen, wo das Modell versagt."}}, {"correct": 1, "en": {"q": "If the learning rate in gradient descent is set far too high, the algorithm typically:", "o": ["converges much faster than usual with no downside whatsoever.", "overshoots the minimum and may diverge.", "is mathematically guaranteed to land on the global minimum.", "stops paying attention to the data and ignores it entirely."], "e": "Steps too large bounce past the minimum and the loss can blow up."}, "de": {"q": "Wird die Lernrate beim Gradientenabstieg viel zu hoch gesetzt, dann:", "o": ["konvergiert der Algorithmus ohne jeden Nachteil viel schneller als sonst.", "schießt er über das Minimum hinaus und kann divergieren.", "ist mathematisch garantiert, dass er das globale Minimum trifft.", "beachtet er die Daten nicht mehr und ignoriert sie vollständig."], "e": "Zu große Schritte springen am Minimum vorbei, und der Verlust kann explodieren."}}, {"correct": 1, "en": {"q": "One practical reason to prefer stochastic gradient descent over full-batch gradient descent is:", "o": ["it is guaranteed to reach a strictly lower loss than batch descent.", "the noisy updates are cheap and can help escape poor local minima.", "it removes any need to choose or tune a learning rate at all.", "it loads the entire dataset into memory at once for every step."], "e": "Per-sample updates scale to large data, and the noise can jolt the search out of shallow traps."}, "de": {"q": "Ein praktischer Grund, stochastischen gegenüber vollem Batch-Gradientenabstieg zu bevorzugen, ist:", "o": ["er erreicht garantiert einen strikt niedrigeren Verlust als der Batch-Abstieg.", "die verrauschten Aktualisierungen sind billig und können helfen, schlechten lokalen Minima zu entkommen.", "er beseitigt jede Notwendigkeit, überhaupt eine Lernrate zu wählen oder einzustellen.", "er lädt für jeden Schritt den gesamten Datensatz auf einmal in den Speicher."], "e": "Aktualisierungen pro Stichprobe skalieren auf große Daten, und das Rauschen kann die Suche aus flachen Fallen stoßen."}}, {"correct": 1, "en": {"q": "Feature scaling (normalization) before gradient descent mainly helps by:", "o": ["altering which of the input features actually end up mattering to the model’s predictions.", "putting features on comparable ranges so the optimizer converges more smoothly.", "doing away with the need to set a learning rate altogether.", "ensuring the training error is driven all the way down to zero."], "e": "Unscaled features stretch the loss surface and slow or destabilize descent."}, "de": {"q": "Merkmalsskalierung (Normalisierung) vor dem Gradientenabstieg hilft vor allem, indem sie:", "o": ["verändert, welche der Eingabemerkmale am Ende tatsächlich für die Vorhersagen des Modells zählen.", "Merkmale auf vergleichbare Bereiche bringt, sodass der Optimierer gleichmäßiger konvergiert.", "die Notwendigkeit, eine Lernrate festzulegen, vollständig beseitigt.", "sicherstellt, dass der Trainingsfehler ganz auf null gebracht wird."], "e": "Unskalierte Merkmale verzerren die Verlustfläche und verlangsamen oder destabilisieren den Abstieg."}}, {"correct": 2, "en": {"q": "In the weight-space view of linear regression, fitting a line means:", "o": ["committing every single training point to memory exactly.", "selecting the steepest slope that the data could possibly allow.", "finding the weights that minimize the loss over the data.", "assigning values to the weights completely at random."], "e": "Each weight setting is a point in weight space with a loss. Fitting is finding the low point."}, "de": {"q": "In der Gewichtsraum-Sicht der linearen Regression bedeutet das Anpassen einer Geraden:", "o": ["sich jeden einzelnen Trainingspunkt exakt einzuprägen.", "die steilste Steigung zu wählen, die die Daten überhaupt zulassen könnten.", "die Gewichte zu finden, die den Verlust über die Daten minimieren.", "den Gewichten völlig zufällig Werte zuzuweisen."], "e": "Jede Gewichtseinstellung ist ein Punkt im Gewichtsraum mit einem Verlust. Anpassen heißt, den tiefsten Punkt zu finden."}}, {"correct": 1, "en": {"q": "A parametric model is a model that:", "o": ["has no parameters at all that can be adjusted during training.", "assumes a fixed functional form with a finite, predetermined number of parameters.", "keeps all of the training data in memory and queries it directly at prediction time.", "cannot be regularized by any penalty placed on its coefficients."], "e": "A line has two parameters regardless of dataset size. Storing all data is non-parametric."}, "de": {"q": "Ein parametrisches Modell ist ein Modell, das:", "o": ["überhaupt keine Parameter besitzt, die sich während des Trainings einstellen lassen.", "eine feste funktionale Form mit einer endlichen, vorab festgelegten Anzahl von Parametern annimmt.", "alle Trainingsdaten im Speicher hält und sie zum Vorhersagezeitpunkt direkt abfragt.", "durch keine auf seine Koeffizienten gesetzte Strafe regularisiert werden kann."], "e": "Eine Gerade hat zwei Parameter, unabhängig von der Datensatzgröße. Alle Daten zu speichern ist nicht-parametrisch."}}, {"correct": 1, "en": {"q": "K-nearest-neighbours with K equal to 1 generally produces:", "o": ["high bias paired with comparatively low variance.", "low bias and high variance.", "both high bias and high variance at the same time.", "both low bias and low variance at the same time."], "e": "K=1 follows every point exactly. Small data changes swing the boundary."}, "de": {"q": "K-Nearest-Neighbours mit K gleich 1 erzeugt im Allgemeinen:", "o": ["hohen Bias gepaart mit vergleichsweise niedriger Varianz.", "niedrigen Bias und hohe Varianz.", "sowohl hohen Bias als auch hohe Varianz zugleich.", "sowohl niedrigen Bias als auch niedrige Varianz zugleich."], "e": "K=1 folgt jedem Punkt exakt. Kleine Änderungen in den Daten kippen die Grenze."}}, {"correct": 1, "en": {"q": "In very high-dimensional space, a hypersphere inscribed in a hypercube of equal edge length:", "o": ["gradually approaches the full volume of the surrounding cube.", "goes to zero as a fraction of the cube’s volume.", "holds at a fixed ratio that does not depend on the dimension.", "grows without bound and diverges toward infinity."], "e": "Almost all the volume ends up in the corners. The inscribed sphere vanishes."}, "de": {"q": "In sehr hochdimensionalem Raum verhält sich eine in einen Hyperwürfel gleicher Kantenlänge einbeschriebene Hyperkugel so:", "o": ["sie nähert sich allmählich dem vollen Volumen des umgebenden Würfels an.", "sie geht als Anteil des Würfelvolumens gegen null.", "sie bleibt ein festes Verhältnis, das nicht von der Dimension abhängt.", "sie wächst unbegrenzt und divergiert gegen unendlich."], "e": "Fast das gesamte Volumen landet in den Ecken. Die einbeschriebene Kugel verschwindet."}}, {"correct": 1, "en": {"q": "K-nearest-neighbours is a non-parametric method because it:", "o": ["has exactly one tunable parameter that it learns from the data.", "keeps the training data and uses it directly at prediction time.", "starts from the assumption that the underlying data is linear.", "is trained by running gradient descent over its parameters."], "e": "KNN does no training step. It defers all work to query time."}, "de": {"q": "K-Nearest-Neighbours ist eine nicht-parametrische Methode, weil es:", "o": ["genau einen einstellbaren Parameter hat, den es aus den Daten lernt.", "die Trainingsdaten behält und sie zum Vorhersagezeitpunkt direkt verwendet.", "von der Annahme ausgeht, dass die zugrunde liegenden Daten linear sind.", "durch Gradientenabstieg über seine Parameter trainiert wird."], "e": "KNN macht keinen Trainingsschritt. Es verschiebt alle Arbeit auf den Abfragezeitpunkt."}}, {"correct": 1, "en": {"q": "Increasing K in K-nearest-neighbours generally:", "o": ["lowers the bias while raising the variance of the predictions.", "raises bias and lowers variance, smoothing the decision boundary.", "has no real effect on the shape of the decision boundary.", "turns the method into a parametric model with fixed form."], "e": "Averaging over more neighbours smooths the boundary and steadies predictions."}, "de": {"q": "Ein größeres K bei K-Nearest-Neighbours bewirkt im Allgemeinen:", "o": ["es senkt den Bias und erhöht zugleich die Varianz der Vorhersagen.", "es erhöht den Bias und senkt die Varianz und glättet die Entscheidungsgrenze.", "es hat keinen wirklichen Einfluss auf die Form der Entscheidungsgrenze.", "es macht die Methode zu einem parametrischen Modell mit fester Form."], "e": "Das Mitteln über mehr Nachbarn glättet die Grenze und stabilisiert die Vorhersagen."}}, {"correct": 1, "en": {"q": "The choice of distance metric in KNN matters because it:", "o": ["changes how many distinct output classes the problem has.", "determines which points count as “near,” and so which neighbours vote.", "becomes irrelevant the moment the value of K has been fixed.", "affects only how long the training takes, rather than the actual predictions it makes."], "e": "Euclidean, Manhattan and cosine distance can pick different neighbours for the same point."}, "de": {"q": "Die Wahl der Distanzmetrik bei KNN ist wichtig, weil sie:", "o": ["ändert, wie viele verschiedene Ausgabeklassen das Problem hat.", "bestimmt, welche Punkte als „nah“ gelten und damit welche Nachbarn abstimmen.", "irrelevant wird, sobald der Wert von K festgelegt ist.", "nur beeinflusst, wie lange das Training dauert, nicht aber die tatsächlichen Vorhersagen."], "e": "Euklidische, Manhattan- und Kosinusdistanz können für denselben Punkt verschiedene Nachbarn auswählen."}}, {"correct": 1, "en": {"q": "A counterintuitive effect of high dimensionality is that:", "o": ["all of the data points collapse onto one identical location.", "two random vectors are almost certainly close to orthogonal.", "distances between points become much easier to interpret.", "every point ends up sitting exactly at the center of the space."], "e": "In high dimensions random directions are nearly perpendicular, and distances concentrate."}, "de": {"q": "Ein kontraintuitiver Effekt hoher Dimensionalität ist, dass:", "o": ["alle Datenpunkte auf einen einzigen identischen Ort zusammenfallen.", "zwei zufällige Vektoren mit hoher Wahrscheinlichkeit nahezu orthogonal sind.", "Abstände zwischen Punkten viel leichter zu interpretieren werden.", "jeder Punkt am Ende genau im Zentrum des Raums liegt."], "e": "In hohen Dimensionen sind zufällige Richtungen nahezu senkrecht, und die Abstände konzentrieren sich."}}, {"correct": 0, "en": {"q": "Global models differ from local models in that:", "o": ["a global model fits one rule to all data, while a local model lets regions behave differently.", "global models are, essentially by their own definition, always non-parametric rather than parametric in form.", "local models are unable to produce any predictions at all.", "global models can operate without needing any training data."], "e": "Linear regression is global. KNN is local."}, "de": {"q": "Globale Modelle unterscheiden sich von lokalen Modellen darin, dass:", "o": ["ein globales Modell eine Regel an alle Daten anpasst, während ein lokales Modell Regionen unterschiedlich verhalten lässt.", "globale Modelle, im Grunde schon per Definition, in ihrer Form stets nicht-parametrisch statt parametrisch sind.", "lokale Modelle überhaupt keine Vorhersagen erzeugen können.", "globale Modelle arbeiten können, ohne irgendwelche Trainingsdaten zu benötigen."], "e": "Lineare Regression ist global. KNN ist lokal."}}, {"correct": 1, "en": {"q": "KNN tends to degrade as the number of features grows because:", "o": ["it immediately exhausts all of the available system memory.", "points become sparse and distances lose their meaning.", "it can no longer find room to store the training data.", "the class labels attached to the data simply vanish."], "e": "The curse of dimensionality flattens distances, so “nearest” stops being meaningful."}, "de": {"q": "KNN verschlechtert sich tendenziell mit wachsender Merkmalszahl, weil:", "o": ["es sofort den gesamten verfügbaren Arbeitsspeicher ausschöpft.", "die Punkte dünn verteilt werden und Abstände ihre Bedeutung verlieren.", "es keinen Platz mehr findet, um die Trainingsdaten zu speichern.", "die an die Daten gehängten Klassenlabels einfach verschwinden."], "e": "Der Fluch der Dimensionalität verflacht die Abstände, sodass „am nächsten“ bedeutungslos wird."}}, {"correct": 1, "en": {"q": "Compared with ridge (L2), lasso (L1):", "o": ["shrinks the coefficients of every feature uniformly and by the same amount.", "can set individual coefficients exactly to zero, implicitly selecting features.", "requires no hyperparameter at all to control the regularization strength.", "can only ever be applied to classification rather than regression problems."], "e": "L1 can zero coefficients and drop features. L2 shrinks them but keeps them all."}, "de": {"q": "Im Vergleich zu Ridge (L2) gilt für Lasso (L1):", "o": ["es verkleinert die Koeffizienten jedes Merkmals gleichmäßig und um denselben Betrag.", "es kann einzelne Koeffizienten exakt auf null setzen und wählt so implizit Merkmale aus.", "es benötigt überhaupt keinen Hyperparameter zur Steuerung der Regularisierungsstärke.", "es ist nur auf Klassifikations- und nicht auf Regressionsprobleme anwendbar."], "e": "L1 kann Koeffizienten auf null setzen und Merkmale entfernen. L2 verkleinert sie, behält aber alle."}}, {"correct": 1, "en": {"q": "Increasing the regularization strength typically causes:", "o": ["lower bias together with higher variance.", "higher bias and lower variance.", "no effect at all on the bias-variance trade-off.", "higher bias and higher variance occurring together."], "e": "More regularization means a simpler model: higher bias, lower variance."}, "de": {"q": "Eine Erhöhung der Regularisierungsstärke bewirkt typischerweise:", "o": ["niedrigeren Bias zusammen mit höherer Varianz.", "höheren Bias und niedrigere Varianz.", "überhaupt keinen Effekt auf den Bias-Varianz-Trade-off.", "höheren Bias und höhere Varianz, die gemeinsam auftreten."], "e": "Mehr Regularisierung heißt einfacheres Modell: höherer Bias, niedrigere Varianz."}}, {"correct": 0, "en": {"q": "High bias in a model corresponds to:", "o": ["a model too rigid to capture the real pattern (underfitting).", "a model far too sensitive to the particular training data.", "a model that achieves an error of zero on the training set.", "a model that has been given far too many input features."], "e": "Bias is systematic error from oversimplified assumptions."}, "de": {"q": "Hoher Bias in einem Modell entspricht:", "o": ["einem Modell, das zu starr ist, um das echte Muster zu erfassen (Unteranpassung).", "einem Modell, das viel zu empfindlich auf die konkreten Trainingsdaten reagiert.", "einem Modell, das auf dem Trainingsdatensatz einen Fehler von null erreicht.", "einem Modell, dem viel zu viele Eingabemerkmale gegeben wurden."], "e": "Bias ist systematischer Fehler aus zu stark vereinfachten Annahmen."}}, {"correct": 1, "en": {"q": "High variance in a model corresponds to:", "o": ["a model that disregards the structure of the training data almost entirely when it is fitted.", "a model overly sensitive to the particular training sample (overfitting).", "a model built from too few parameters to fit anything.", "a model that records no error at all on the test set."], "e": "Variance is how much the fitted model swings when the training data changes."}, "de": {"q": "Hohe Varianz in einem Modell entspricht:", "o": ["einem Modell, das die Struktur der Trainingsdaten beim Anpassen fast vollständig außer Acht lässt.", "einem Modell, das übermäßig empfindlich auf die konkrete Trainingsstichprobe reagiert (Überanpassung).", "einem Modell, das aus zu wenigen Parametern besteht, um irgendetwas anzupassen.", "einem Modell, das auf dem Testdatensatz überhaupt keinen Fehler verzeichnet."], "e": "Varianz ist, wie stark das angepasste Modell schwankt, wenn sich die Trainingsdaten ändern."}}, {"correct": 1, "en": {"q": "Simpson’s paradox describes a situation where:", "o": ["two separate models happen to produce the very same prediction.", "a trend present in every subgroup reverses when the groups are combined.", "the accuracy of a model rises as more features are added to it.", "regularization ends up stripping every feature out of the model."], "e": "The UC Berkeley admissions case: each department favored women, the aggregate looked the opposite."}, "de": {"q": "Das Simpson-Paradoxon beschreibt eine Situation, in der:", "o": ["zwei getrennte Modelle zufällig genau dieselbe Vorhersage erzeugen.", "ein in jeder Untergruppe vorhandener Trend sich umkehrt, wenn die Gruppen zusammengelegt werden.", "die Genauigkeit eines Modells steigt, je mehr Merkmale ihm hinzugefügt werden.", "die Regularisierung am Ende jedes Merkmal aus dem Modell entfernt."], "e": "Der Fall der UC-Berkeley-Zulassungen: Jede Fakultät bevorzugte Frauen, das Aggregat sah umgekehrt aus."}}, {"correct": 1, "en": {"q": "Adding a polynomial feature such as x² to a linear regression:", "o": ["makes the model non-linear in its parameters as well as its inputs.", "lets the model fit curves while staying linear in the parameters.", "is something that turns out to be mathematically impossible to do.", "always brings about a reduction in the model’s test error."], "e": "x² is just another input column. The model stays linear in the weights."}, "de": {"q": "Das Hinzufügen eines polynomialen Merkmals wie x² zu einer linearen Regression:", "o": ["macht das Modell sowohl in seinen Parametern als auch in seinen Eingaben nicht-linear.", "lässt das Modell Kurven anpassen, während es in den Parametern linear bleibt.", "ist etwas, das sich als mathematisch unmöglich herausstellt.", "bewirkt stets eine Verringerung des Testfehlers des Modells."], "e": "x² ist einfach eine weitere Eingabespalte. Das Modell bleibt linear in den Gewichten."}}, {"correct": 1, "en": {"q": "Ridge regression (L2) handles a group of correlated features by:", "o": ["dropping all but one of the correlated features outright.", "shrinking them all and spreading weight across them.", "leaving the correlated features completely unchanged.", "forcing every one of those coefficients down to zero."], "e": "L2 keeps every feature small rather than choosing among correlated ones."}, "de": {"q": "Die Ridge-Regression (L2) behandelt eine Gruppe korrelierter Merkmale, indem sie:", "o": ["alle bis auf eines der korrelierten Merkmale kurzerhand entfernt.", "sie alle verkleinert und das Gewicht über sie verteilt.", "die korrelierten Merkmale völlig unverändert lässt.", "jeden dieser Koeffizienten auf null zwingt."], "e": "L2 hält jedes Merkmal klein, statt zwischen korrelierten zu wählen."}}, {"correct": 1, "en": {"q": "Minimizing training error is not the goal of learning because:", "o": ["the training error of a model is something that cannot be computed.", "a model can drive training error to zero by memorizing noise and still fail on new data.", "the training error and the test error of a model always turn out to be exactly equal in the end.", "the test set is in practice never available to the modeler at all."], "e": "Zero training error often signals overfitting, not a good model."}, "de": {"q": "Den Trainingsfehler zu minimieren ist nicht das Ziel des Lernens, weil:", "o": ["der Trainingsfehler eines Modells etwas ist, das sich nicht berechnen lässt.", "ein Modell den Trainingsfehler durch Auswendiglernen von Rauschen auf null drücken und bei neuen Daten dennoch versagen kann.", "der Trainingsfehler und der Testfehler eines Modells am Ende stets genau gleich ausfallen.", "der Testdatensatz dem Modellierer in der Praxis nie zur Verfügung steht."], "e": "Ein Trainingsfehler von null deutet oft auf Überanpassung hin, nicht auf ein gutes Modell."}}, {"correct": 1, "en": {"q": "Regularization works by adding to the loss:", "o": ["a quantity of additional training data drawn from the same source.", "a penalty that grows with model complexity or the size of the weights.", "a reward for fitting the training set as perfectly as possible.", "a constant value chosen completely at random each time."], "e": "The penalty discourages large weights, trading a little fit for stability."}, "de": {"q": "Regularisierung funktioniert, indem sie dem Verlust Folgendes hinzufügt:", "o": ["eine Menge zusätzlicher Trainingsdaten aus derselben Quelle.", "eine Strafe, die mit der Modellkomplexität oder der Größe der Gewichte wächst.", "eine Belohnung dafür, den Trainingsdatensatz so perfekt wie möglich anzupassen.", "einen konstanten Wert, der jedes Mal völlig zufällig gewählt wird."], "e": "Die Strafe entmutigt große Gewichte und tauscht etwas Anpassung gegen Stabilität."}}, {"correct": 1, "en": {"q": "A headline reports that average household income rose, yet income fell within every age group. The most likely explanation is:", "o": ["a simple arithmetic mistake somewhere in the calculation.", "a shift in group sizes, a form of Simpson’s paradox.", "the effect of applying regularization to the underlying model.", "overfitting of the model to its training data."], "e": "Aggregation can hide subgroup trends when the mix of groups changes."}, "de": {"q": "Eine Schlagzeile meldet, das durchschnittliche Haushaltseinkommen sei gestiegen, doch innerhalb jeder Altersgruppe ist das Einkommen gefallen. Die wahrscheinlichste Erklärung ist:", "o": ["ein einfacher Rechenfehler irgendwo in der Berechnung.", "eine Verschiebung der Gruppengrößen, eine Form des Simpson-Paradoxons.", "die Wirkung der Regularisierung des zugrunde liegenden Modells.", "eine Überanpassung des Modells an seine Trainingsdaten."], "e": "Aggregation kann Trends in Untergruppen verbergen, wenn sich die Zusammensetzung der Gruppen ändert."}}, {"correct": 1, "en": {"q": "The fundamental difference between regression and classification is that:", "o": ["regression relies entirely on gradient descent for fitting, while classification never makes use of it.", "regression predicts a continuous value, classification predicts a discrete category.", "classification simply cannot be carried out using any linear model.", "classification, unlike regression, needs no labeled training data."], "e": "Regression predicts a number, classification predicts a class. Both use labels."}, "de": {"q": "Der grundlegende Unterschied zwischen Regression und Klassifikation besteht darin, dass:", "o": ["Regression sich beim Anpassen ganz auf Gradientenabstieg stützt, während Klassifikation ihn nie verwendet.", "Regression einen stetigen Wert vorhersagt, Klassifikation hingegen eine diskrete Kategorie.", "Klassifikation schlicht nicht mit irgendeinem linearen Modell durchgeführt werden kann.", "Klassifikation, anders als Regression, keine markierten Trainingsdaten benötigt."], "e": "Regression sagt eine Zahl vorher, Klassifikation eine Klasse. Beide nutzen Labels."}}, {"correct": 1, "en": {"q": "Accuracy as a classification metric can mislead when:", "o": ["the classes in the dataset are evenly balanced.", "the classes are strongly imbalanced.", "the model has been given too few input features.", "the decision boundary turns out to be exactly linear."], "e": "On 95% negatives, “always no” scores 95% accuracy and detects nothing."}, "de": {"q": "Die Genauigkeit als Klassifikationsmetrik kann irreführen, wenn:", "o": ["die Klassen im Datensatz gleichmäßig ausgewogen sind.", "die Klassen stark unausgewogen sind.", "dem Modell zu wenige Eingabemerkmale gegeben wurden.", "sich die Entscheidungsgrenze als exakt linear herausstellt."], "e": "Bei 95 % Negativen erzielt „immer Nein“ 95 % Genauigkeit und erkennt nichts."}}, {"correct": 1, "en": {"q": "The “naive” assumption in Naive Bayes is that:", "o": ["every class in the problem is taken to be equally likely.", "features are conditionally independent given the class.", "the data is assumed to be perfectly linearly separable.", "there are only ever exactly two classes to choose between."], "e": "The assumption is usually false, yet the classifier often works well anyway."}, "de": {"q": "Die „naive“ Annahme bei Naive Bayes ist, dass:", "o": ["jede Klasse im Problem als gleich wahrscheinlich angenommen wird.", "Merkmale bei gegebener Klasse bedingt unabhängig sind.", "die Daten als perfekt linear trennbar angenommen werden.", "es immer nur genau zwei Klassen zur Auswahl gibt."], "e": "Die Annahme ist meist falsch, dennoch funktioniert der Klassifikator oft trotzdem gut."}}, {"correct": 0, "en": {"q": "Precision is defined as:", "o": ["true positives divided by all predicted positives.", "true positives divided by the count of all actual positives.", "all correct predictions divided by the total number of predictions.", "false positives divided by the number of true negatives."], "e": "Of the items the model flagged, how many were right."}, "de": {"q": "Präzision (Precision) ist definiert als:", "o": ["richtig Positive geteilt durch alle als positiv vorhergesagten Fälle.", "richtig Positive geteilt durch die Zahl aller tatsächlich Positiven.", "alle korrekten Vorhersagen geteilt durch die Gesamtzahl der Vorhersagen.", "falsch Positive geteilt durch die Zahl der richtig Negativen."], "e": "Von den Einträgen, die das Modell markiert hat, wie viele richtig waren."}}, {"correct": 1, "en": {"q": "Recall is defined as:", "o": ["true positives divided by the count of all predicted positives.", "true positives divided by all actual positives.", "true negatives divided by the total number of actual negatives.", "the harmonic mean taken between accuracy and precision."], "e": "Of the items that were actually positive, how many the model caught."}, "de": {"q": "Trefferquote (Recall) ist definiert als:", "o": ["richtig Positive geteilt durch die Zahl aller als positiv vorhergesagten Fälle.", "richtig Positive geteilt durch alle tatsächlich Positiven.", "richtig Negative geteilt durch die Gesamtzahl der tatsächlich Negativen.", "das harmonische Mittel zwischen Genauigkeit und Präzision."], "e": "Von den Einträgen, die tatsächlich positiv waren, wie viele das Modell erfasst hat."}}, {"correct": 1, "en": {"q": "The F1 score is:", "o": ["the plain arithmetic mean of accuracy and recall.", "the harmonic mean of precision and recall.", "the simple product of precision and recall multiplied together.", "the raw count of true positives produced by the model."], "e": "F1 punishes a large gap between precision and recall."}, "de": {"q": "Der F1-Wert ist:", "o": ["das schlichte arithmetische Mittel aus Genauigkeit und Trefferquote.", "das harmonische Mittel aus Präzision und Trefferquote.", "das einfache Produkt aus Präzision und Trefferquote, miteinander multipliziert.", "die rohe Anzahl der vom Modell erzeugten richtig Positiven."], "e": "F1 bestraft eine große Lücke zwischen Präzision und Trefferquote."}}, {"correct": 1, "en": {"q": "A flu test is 99% accurate, but only 1 in 1000 people has the flu. A positive result means the actual chance of having flu is:", "o": ["roughly 99 percent, matching the stated accuracy of the test.", "low, because false positives swamp the rare true cases.", "exactly 50 percent, an even split between the two possibilities.", "effectively certain that the person does have the flu."], "e": "With a tiny prior, most positives are false positives. Base rates dominate."}, "de": {"q": "Ein Grippetest ist zu 99 % genau, aber nur 1 von 1000 Personen hat die Grippe. Ein positives Ergebnis bedeutet, dass die tatsächliche Wahrscheinlichkeit, Grippe zu haben:", "o": ["bei etwa 99 Prozent liegt, passend zur angegebenen Genauigkeit des Tests.", "niedrig ist, weil falsch Positive die seltenen echten Fälle überschwemmen.", "genau 50 Prozent beträgt, ein gleichmäßiges Verhältnis zwischen beiden Möglichkeiten.", "praktisch sicher ist, dass die Person die Grippe hat."], "e": "Bei winziger Vorwahrscheinlichkeit sind die meisten Positiven falsch positiv. Die Basisraten dominieren."}}, {"correct": 1, "en": {"q": "Logistic regression produces:", "o": ["an unbounded continuous prediction with no fixed range.", "a probability between 0 and 1 via the sigmoid.", "a hard class label with no associated probability at all.", "a cluster assignment that groups similar points together."], "e": "The sigmoid squashes the linear score into a probability, then a threshold decides the class."}, "de": {"q": "Die logistische Regression erzeugt:", "o": ["eine unbeschränkte stetige Vorhersage ohne festen Wertebereich.", "eine Wahrscheinlichkeit zwischen 0 und 1 über die Sigmoidfunktion.", "ein hartes Klassenlabel ganz ohne zugehörige Wahrscheinlichkeit.", "eine Clusterzuordnung, die ähnliche Punkte zusammengruppiert."], "e": "Die Sigmoidfunktion quetscht den linearen Score zu einer Wahrscheinlichkeit, dann entscheidet ein Schwellenwert die Klasse."}}, {"correct": 0, "en": {"q": "A marketing team runs an expensive outbound campaign and can only afford to contact the customers a model flags as likely buyers. The metric they should prioritize is:", "o": ["precision, so that flagged customers are actually likely to convert.", "recall, so that no potential buyer is ever missed by the model.", "raw accuracy measured across the entire customer base.", "the total number of input features the model was trained on."], "e": "Each contact costs money. A false positive wastes spend on someone who will not buy, so they want the flagged set to be right."}, "de": {"q": "Ein Marketingteam führt eine teure Outbound-Kampagne durch und kann es sich nur leisten, die Kunden zu kontaktieren, die ein Modell als wahrscheinliche Käufer markiert. Die Metrik, die es priorisieren sollte, ist:", "o": ["Präzision, damit markierte Kunden tatsächlich wahrscheinlich konvertieren.", "Trefferquote, damit kein potenzieller Käufer je vom Modell übersehen wird.", "rohe Genauigkeit, gemessen über den gesamten Kundenstamm.", "die Gesamtzahl der Eingabemerkmale, mit denen das Modell trainiert wurde."], "e": "Jeder Kontakt kostet Geld. Ein falsch Positiver verschwendet Ausgaben an jemanden, der nicht kauft, also soll die markierte Menge stimmen."}}, {"correct": 1, "en": {"q": "In real-time fraud detection, recall usually matters more than precision because:", "o": ["raising a false alarm carries no real cost to the bank at all.", "missing a real fraud is more costly than reviewing a false alarm.", "fraudulent transactions form the majority class in the data.", "the precision of such a model simply cannot be measured."], "e": "A missed fraud is money gone. A false flag costs a review. The errors are not equal."}, "de": {"q": "Bei der Echtzeit-Betrugserkennung zählt die Trefferquote meist mehr als die Präzision, weil:", "o": ["ein falscher Alarm der Bank überhaupt keine echten Kosten verursacht.", "ein übersehener echter Betrug teurer ist als das Prüfen eines falschen Alarms.", "betrügerische Transaktionen die Mehrheitsklasse in den Daten bilden.", "die Präzision eines solchen Modells schlicht nicht gemessen werden kann."], "e": "Ein übersehener Betrug ist verlorenes Geld. Eine falsche Markierung kostet eine Prüfung. Die Fehler sind nicht gleich."}}, {"correct": 1, "en": {"q": "A decision tree makes predictions by:", "o": ["fitting one single global linear equation across the whole of the data in just one step.", "recursively partitioning the feature space and assigning each region an output.", "averaging together the outputs of the K nearest neighbours.", "computing a probability by passing a score through the sigmoid."], "e": "Each split carves the space. Each leaf is a region with a prediction."}, "de": {"q": "Ein Entscheidungsbaum trifft Vorhersagen, indem er:", "o": ["in nur einem Schritt eine einzige globale lineare Gleichung an die gesamten Daten anpasst.", "den Merkmalsraum rekursiv aufteilt und jeder Region eine Ausgabe zuweist.", "die Ausgaben der K nächsten Nachbarn mittelt.", "eine Wahrscheinlichkeit berechnet, indem er einen Score durch die Sigmoidfunktion schickt."], "e": "Jeder Split zerteilt den Raum. Jedes Blatt ist eine Region mit einer Vorhersage."}}, {"correct": 1, "en": {"q": "A leaf node in a decision tree represents:", "o": ["a feature on which the tree will choose to split next.", "a final prediction for all points that reach it.", "the root from which the entire tree originally grows.", "the learning rate that governs how the tree is built."], "e": "Once you reach a leaf, the tree has decided."}, "de": {"q": "Ein Blattknoten in einem Entscheidungsbaum repräsentiert:", "o": ["ein Merkmal, an dem der Baum als Nächstes splitten wird.", "eine endgültige Vorhersage für alle Punkte, die ihn erreichen.", "die Wurzel, aus der der gesamte Baum ursprünglich wächst.", "die Lernrate, die steuert, wie der Baum gebaut wird."], "e": "Sobald du ein Blatt erreichst, hat der Baum entschieden."}}, {"correct": 1, "en": {"q": "Information gain at a split is:", "o": ["the total number of samples that arrive at the node.", "the reduction in impurity achieved by the split.", "the overall depth of the tree once it is fully grown.", "the accuracy of the tree measured on the test set."], "e": "The tree chooses the split that drops impurity the most."}, "de": {"q": "Der Informationsgewinn bei einem Split ist:", "o": ["die Gesamtzahl der Stichproben, die am Knoten ankommen.", "die durch den Split erreichte Verringerung der Unreinheit.", "die Gesamttiefe des Baums, sobald er voll ausgewachsen ist.", "die Genauigkeit des Baums, gemessen auf dem Testdatensatz."], "e": "Der Baum wählt den Split, der die Unreinheit am stärksten senkt."}}, {"correct": 1, "en": {"q": "Entropy at a node is highest when:", "o": ["every sample at the node belongs to one single class.", "the classes are evenly mixed.", "the node in question happens to be a terminal leaf.", "the node contains only a single training sample."], "e": "Maximum uncertainty is a 50/50 mix. A pure node has entropy zero."}, "de": {"q": "Die Entropie an einem Knoten ist am höchsten, wenn:", "o": ["jede Stichprobe am Knoten zu einer einzigen Klasse gehört.", "die Klassen gleichmäßig gemischt sind.", "der betreffende Knoten zufällig ein Endblatt ist.", "der Knoten nur eine einzige Trainingsstichprobe enthält."], "e": "Maximale Unsicherheit ist eine 50/50-Mischung. Ein reiner Knoten hat Entropie null."}}, {"correct": 1, "en": {"q": "Gini impurity measures:", "o": ["the overall depth of the decision tree once it is grown.", "the chance of misclassifying a randomly drawn sample labeled by the node’s class distribution.", "the number of input features available for splitting.", "the learning rate that controls how the tree grows."], "e": "Like entropy, it is lowest for a pure node and highest for an even mix."}, "de": {"q": "Die Gini-Unreinheit misst:", "o": ["die Gesamttiefe des Entscheidungsbaums, sobald er ausgewachsen ist.", "die Wahrscheinlichkeit, eine zufällig gezogene Stichprobe falsch zu klassifizieren, wenn man sie gemäß der Klassenverteilung des Knotens labelt.", "die Zahl der zum Splitten verfügbaren Eingabemerkmale.", "die Lernrate, die steuert, wie der Baum wächst."], "e": "Wie die Entropie ist sie für einen reinen Knoten am niedrigsten und für eine gleichmäßige Mischung am höchsten."}}, {"correct": 1, "en": {"q": "A node containing samples of only one class has:", "o": ["the maximum possible entropy for that node.", "zero impurity.", "an information gain value that is left undefined.", "the largest Gini value the node could possibly take."], "e": "A pure node needs no further split."}, "de": {"q": "Ein Knoten, der Stichproben nur einer einzigen Klasse enthält, hat:", "o": ["die maximal mögliche Entropie für diesen Knoten.", "Unreinheit null.", "einen Informationsgewinn-Wert, der undefiniert bleibt.", "den größtmöglichen Gini-Wert, den der Knoten annehmen könnte."], "e": "Ein reiner Knoten braucht keinen weiteren Split."}}, {"correct": 1, "en": {"q": "A common reason decision trees are favored in regulated settings is that:", "o": ["they reliably reach the very highest predictive accuracy of any available model on the task.", "their decisions can be read and explained, satisfying interpretability requirements.", "they are structurally incapable of ever overfitting the data.", "they can be built and used without any training data at all."], "e": "You can trace exactly why the model decided as it did."}, "de": {"q": "Ein häufiger Grund, warum Entscheidungsbäume in regulierten Bereichen bevorzugt werden, ist, dass:", "o": ["sie zuverlässig die allerhöchste Vorhersagegenauigkeit jedes verfügbaren Modells bei der Aufgabe erreichen.", "ihre Entscheidungen gelesen und erklärt werden können und so Anforderungen an die Erklärbarkeit erfüllen.", "sie strukturell unfähig sind, die Daten jemals zu überanpassen.", "sie ganz ohne Trainingsdaten gebaut und genutzt werden können."], "e": "Man kann genau nachvollziehen, warum das Modell so entschieden hat."}}, {"correct": 0, "en": {"q": "EU rules around credit scoring push toward interpretable models because:", "o": ["a person denied credit can demand an explanation of the decision.", "interpretable models are in every case more accurate than the alternatives.", "black-box models happen to run faster than interpretable ones.", "decision trees can be trained without needing any data at all."], "e": "The right to an explanation favors models whose logic can be stated."}, "de": {"q": "EU-Regeln rund um das Kreditscoring drängen zu interpretierbaren Modellen, weil:", "o": ["eine Person, der Kredit verweigert wird, eine Erklärung der Entscheidung verlangen kann.", "interpretierbare Modelle in jedem Fall genauer sind als die Alternativen.", "Blackbox-Modelle zufällig schneller laufen als interpretierbare.", "Entscheidungsbäume trainiert werden können, ohne irgendwelche Daten zu brauchen."], "e": "Das Recht auf eine Erklärung begünstigt Modelle, deren Logik sich darlegen lässt."}}, {"correct": 1, "en": {"q": "When a credit-scoring tree splits on postal code, the danger is that:", "o": ["postal codes carry no predictive value whatsoever for the task.", "the feature can act as a proxy for a protected attribute like ethnicity.", "the tree is converted into a parametric model by the split.", "the entropy at that node immediately collapses to zero."], "e": "Dropping a protected attribute does not help if a correlated feature smuggles it back in."}, "de": {"q": "Wenn ein Kreditscoring-Baum nach Postleitzahl splittet, besteht die Gefahr, dass:", "o": ["Postleitzahlen für die Aufgabe überhaupt keinen Vorhersagewert besitzen.", "das Merkmal als Stellvertreter für ein geschütztes Attribut wie Ethnie wirken kann.", "der Baum durch den Split in ein parametrisches Modell verwandelt wird.", "die Entropie an diesem Knoten sofort auf null fällt."], "e": "Ein geschütztes Attribut wegzulassen hilft nicht, wenn ein korreliertes Merkmal es wieder hereinschmuggelt."}}, {"correct": 1, "en": {"q": "A decision tree grown to full depth on the training set tends to:", "o": ["underfit the data and miss the real underlying pattern.", "overfit by memorizing the training data, including its noise.", "settle into a state of unusually high bias.", "generalize to new data essentially perfectly."], "e": "An unconstrained tree can fit every point. Depth limits and pruning fight this."}, "de": {"q": "Ein bis zur vollen Tiefe auf den Trainingsdaten gewachsener Entscheidungsbaum neigt dazu:", "o": ["die Daten zu unteranpassen und das echte zugrunde liegende Muster zu verfehlen.", "zu überanpassen, indem er die Trainingsdaten samt ihrem Rauschen auswendig lernt.", "sich in einem Zustand ungewöhnlich hohen Bias einzupendeln.", "auf neue Daten im Wesentlichen perfekt zu verallgemeinern."], "e": "Ein unbeschränkter Baum kann jeden Punkt anpassen. Tiefenlimits und Pruning wirken dem entgegen."}}, {"correct": 1, "en": {"q": "A random forest combines:", "o": ["a single deep tree that has been heavily pruned back.", "many trees trained on bootstrap samples with random feature subsets.", "one linear model combined together with a single decision tree.", "gradient descent applied on top of a KNN classifier."], "e": "Bootstrap aggregating plus random features makes the trees diverse."}, "de": {"q": "Ein Random Forest kombiniert:", "o": ["einen einzelnen tiefen Baum, der stark zurückgeschnitten wurde.", "viele Bäume, trainiert auf Bootstrap-Stichproben mit zufälligen Merkmalsteilmengen.", "ein lineares Modell, kombiniert mit einem einzelnen Entscheidungsbaum.", "Gradientenabstieg, angewandt auf einen KNN-Klassifikator."], "e": "Bootstrap-Aggregation plus zufällige Merkmale macht die Bäume vielfältig."}}, {"correct": 1, "en": {"q": "Averaging many diverse, slightly-wrong models works because it:", "o": ["raises the overall bias of the combined model.", "reduces variance, since independent errors tend to cancel.", "does away with the need for any training data.", "guarantees that the combined error drops to zero."], "e": "Diversity is the point. Correlated trees would not help."}, "de": {"q": "Das Mitteln vieler vielfältiger, leicht falscher Modelle funktioniert, weil es:", "o": ["den Gesamt-Bias des kombinierten Modells erhöht.", "die Varianz senkt, da sich unabhängige Fehler tendenziell ausgleichen.", "die Notwendigkeit von Trainingsdaten beseitigt.", "garantiert, dass der kombinierte Fehler auf null fällt."], "e": "Vielfalt ist der Punkt. Korrelierte Bäume würden nicht helfen."}}, {"correct": 0, "en": {"q": "Bagging (bootstrap aggregating) trains its learners:", "o": ["independently, each on a resampled version of the data.", "sequentially, with each learner correcting the previous one.", "jointly, with a meta-model stacked on top of them.", "on identical data with no resampling applied at all."], "e": "Independent learners, then average or vote."}, "de": {"q": "Bagging (Bootstrap-Aggregation) trainiert seine Lerner:", "o": ["unabhängig, jeden auf einer neu gezogenen Version der Daten.", "sequenziell, wobei jeder Lerner den vorherigen korrigiert.", "gemeinsam, mit einem Meta-Modell, das auf ihnen aufgesetzt ist.", "auf identischen Daten ganz ohne erneute Stichprobenziehung."], "e": "Unabhängige Lerner, dann mitteln oder abstimmen."}}, {"correct": 1, "en": {"q": "Boosting differs from bagging in that it:", "o": ["trains every single one of its base learners fully in parallel and independently of one another.", "trains learners sequentially, each focusing on the previous ones’ errors.", "makes no use of weak learners of any kind.", "is unable to use decision trees as its base learners."], "e": "Boosting chases the leftovers: each model targets what the last got wrong."}, "de": {"q": "Boosting unterscheidet sich von Bagging dadurch, dass es:", "o": ["jeden einzelnen seiner Basislerner vollständig parallel und unabhängig voneinander trainiert.", "Lerner sequenziell trainiert, wobei jeder sich auf die Fehler der vorherigen konzentriert.", "keinerlei schwache Lerner verwendet.", "Entscheidungsbäume nicht als Basislerner nutzen kann."], "e": "Boosting jagt die Reste: Jedes Modell zielt auf das, was das letzte falsch gemacht hat."}}, {"correct": 1, "en": {"q": "Stacking builds an ensemble by:", "o": ["averaging together a set of essentially identical models all trained in the very same way.", "training a meta-model to combine the predictions of several base models.", "pruning back a single tree until it stops overfitting.", "resampling the training data one time before fitting."], "e": "The meta-model learns how to weigh the base learners."}, "de": {"q": "Stacking baut ein Ensemble, indem es:", "o": ["eine Menge im Wesentlichen identischer Modelle mittelt, die alle auf genau dieselbe Weise trainiert wurden.", "ein Meta-Modell trainiert, um die Vorhersagen mehrerer Basismodelle zu kombinieren.", "einen einzelnen Baum zurückschneidet, bis er nicht mehr überanpasst.", "die Trainingsdaten vor dem Anpassen einmal neu zieht."], "e": "Das Meta-Modell lernt, wie es die Basislerner gewichtet."}}, {"correct": 1, "en": {"q": "A bootstrap sample is drawn:", "o": ["without replacement, producing a sample smaller than the original.", "with replacement, so some points repeat and others are left out.", "only from the held-out test set rather than the training data.", "by sorting the data and taking it in a fixed order."], "e": "Sampling with replacement gives each tree a slightly different dataset."}, "de": {"q": "Eine Bootstrap-Stichprobe wird gezogen:", "o": ["ohne Zurücklegen, was eine kleinere Stichprobe als das Original ergibt.", "mit Zurücklegen, sodass manche Punkte mehrfach vorkommen und andere ausgelassen werden.", "nur aus dem zurückgehaltenen Testdatensatz statt aus den Trainingsdaten.", "durch Sortieren der Daten und Entnahme in fester Reihenfolge."], "e": "Ziehen mit Zurücklegen gibt jedem Baum einen leicht anderen Datensatz."}}, {"correct": 1, "en": {"q": "Compared with a single decision tree, a random forest usually:", "o": ["tends to overfit the training data even more badly.", "generalizes better thanks to lower variance.", "ends up being considerably easier to interpret.", "is trained on a smaller portion of the data."], "e": "You trade the readability of one tree for the stability of many."}, "de": {"q": "Im Vergleich zu einem einzelnen Entscheidungsbaum tut ein Random Forest meist Folgendes:", "o": ["er neigt dazu, die Trainingsdaten noch stärker zu überanpassen.", "er verallgemeinert dank niedrigerer Varianz besser.", "er ist am Ende erheblich leichter zu interpretieren.", "er wird auf einem kleineren Teil der Daten trainiert."], "e": "Du tauschst die Lesbarkeit eines Baums gegen die Stabilität vieler."}}, {"correct": 1, "en": {"q": "Feature importance from a random forest tells you:", "o": ["the exact causal effect that each feature has on the target.", "roughly how much each feature contributed to the model’s splits.", "the learning rate that was used while fitting the model.", "precisely which training samples ended up misclassified."], "e": "It ranks features by contribution. It is association, not proof of causation."}, "de": {"q": "Die Merkmalswichtigkeit aus einem Random Forest sagt dir:", "o": ["den exakten kausalen Effekt, den jedes Merkmal auf das Ziel hat.", "ungefähr, wie stark jedes Merkmal zu den Splits des Modells beigetragen hat.", "die Lernrate, die beim Anpassen des Modells verwendet wurde.", "genau, welche Trainingsstichproben am Ende falsch klassifiziert wurden."], "e": "Sie ordnet Merkmale nach Beitrag. Das ist Assoziation, kein Kausalbeweis."}}, {"correct": 1, "en": {"q": "The purpose of a held-out test set is to:", "o": ["train the model to a higher level of accuracy.", "estimate performance on data the model has not seen.", "enlarge the pool of data available for training.", "tune the learning rate over the course of training."], "e": "Evaluating on the training set tells you how well it memorized, not how well it generalizes."}, "de": {"q": "Der Zweck eines zurückgehaltenen Testdatensatzes ist es:", "o": ["das Modell auf ein höheres Genauigkeitsniveau zu trainieren.", "die Leistung auf Daten zu schätzen, die das Modell nicht gesehen hat.", "den Datenpool zu vergrößern, der für das Training verfügbar ist.", "die Lernrate im Verlauf des Trainings einzustellen."], "e": "Die Auswertung auf den Trainingsdaten zeigt, wie gut es auswendig gelernt hat, nicht wie gut es verallgemeinert."}}, {"correct": 0, "en": {"q": "In K-fold cross-validation, the data is:", "o": ["split into K parts; each part serves as the test set once while the rest train.", "split just a single time into one training set and one separate held-out test set.", "used in its entirety for training with nothing held back.", "shuffled thoroughly and then discarded before fitting."], "e": "Every point gets to be in the test set exactly once. Scores are averaged."}, "de": {"q": "Bei der K-fachen Kreuzvalidierung werden die Daten:", "o": ["in K Teile geteilt; jeder Teil dient einmal als Testmenge, während der Rest trainiert.", "nur ein einziges Mal in eine Trainingsmenge und eine separate, zurückgehaltene Testmenge geteilt.", "vollständig fürs Training verwendet, ohne dass etwas zurückgehalten wird.", "gründlich gemischt und dann vor dem Anpassen verworfen."], "e": "Jeder Punkt ist genau einmal in der Testmenge. Die Werte werden gemittelt."}}, {"correct": 1, "en": {"q": "Leave-one-out cross-validation on n samples trains:", "o": ["just one single model over the whole dataset.", "n models, each leaving out a single sample.", "K models, for some chosen K smaller than n.", "no models at all during the procedure."], "e": "Clean in theory, costly in practice for large n."}, "de": {"q": "Leave-One-Out-Kreuzvalidierung bei n Stichproben trainiert:", "o": ["nur ein einziges Modell über den gesamten Datensatz.", "n Modelle, von denen jedes eine einzelne Stichprobe auslässt.", "K Modelle, für ein gewähltes K kleiner als n.", "überhaupt keine Modelle während des Verfahrens."], "e": "Sauber in der Theorie, teuer in der Praxis bei großem n."}}, {"correct": 0, "en": {"q": "The difference between a parameter and a hyperparameter is that:", "o": ["parameters are learned from data; hyperparameters are set before training.", "hyperparameters are learned from data while parameters are chosen by hand.", "the two terms refer to exactly the same thing.", "hyperparameters exist only within neural networks."], "e": "Weights are parameters. The regularization strength or K is a hyperparameter."}, "de": {"q": "Der Unterschied zwischen einem Parameter und einem Hyperparameter ist, dass:", "o": ["Parameter aus Daten gelernt werden; Hyperparameter werden vor dem Training festgelegt.", "Hyperparameter aus Daten gelernt werden, während Parameter von Hand gewählt werden.", "die beiden Begriffe genau dasselbe bezeichnen.", "Hyperparameter nur innerhalb neuronaler Netze existieren."], "e": "Gewichte sind Parameter. Die Regularisierungsstärke oder K ist ein Hyperparameter."}}, {"correct": 1, "en": {"q": "Grid search finds hyperparameters by:", "o": ["guessing a single hyperparameter configuration at random and then stopping there immediately.", "evaluating every combination from a predefined grid and keeping the best.", "training just one model and accepting its settings as final.", "running gradient descent directly on the target labels."], "e": "Exhaustive over the grid, which is why it gets expensive fast."}, "de": {"q": "Die Gittersuche findet Hyperparameter, indem sie:", "o": ["eine einzige Hyperparameter-Konfiguration zufällig rät und dann sofort dort aufhört.", "jede Kombination aus einem vordefinierten Gitter auswertet und die beste behält.", "nur ein Modell trainiert und dessen Einstellungen als endgültig akzeptiert.", "Gradientenabstieg direkt auf den Ziellabels ausführt."], "e": "Erschöpfend über das Gitter, weshalb es schnell teuer wird."}}, {"correct": 1, "en": {"q": "Stratified cross-validation is used mainly to:", "o": ["make the overall training and validation procedure run noticeably faster than before.", "preserve the class proportions in each fold for imbalanced data.", "get rid of the test set during the procedure.", "increase the learning rate used while training."], "e": "Without stratification, a fold might miss a rare class entirely."}, "de": {"q": "Stratifizierte Kreuzvalidierung wird hauptsächlich verwendet, um:", "o": ["das gesamte Trainings- und Validierungsverfahren spürbar schneller als zuvor laufen zu lassen.", "die Klassenanteile in jeder Falte bei unausgewogenen Daten zu erhalten.", "die Testmenge während des Verfahrens loszuwerden.", "die beim Training verwendete Lernrate zu erhöhen."], "e": "Ohne Stratifizierung könnte eine Falte eine seltene Klasse völlig verfehlen."}}, {"correct": 1, "en": {"q": "Tuning many hyperparameters against the same validation set risks:", "o": ["underfitting the training set badly rather than fitting it the way the search intended.", "overfitting to the validation set, so the estimate becomes optimistic.", "eliminating all of the features from the model.", "turning the model into a parametric one."], "e": "Repeated peeking at the validation set quietly leaks information into the choice."}, "de": {"q": "Das Abstimmen vieler Hyperparameter gegen dieselbe Validierungsmenge birgt das Risiko:", "o": ["die Trainingsmenge stark zu unteranpassen, statt sie so anzupassen, wie es die Suche beabsichtigte.", "die Validierungsmenge zu überanpassen, sodass die Schätzung optimistisch wird.", "alle Merkmale aus dem Modell zu entfernen.", "das Modell in e
