in parametrisches zu verwandeln."], "e": "Wiederholtes Spicken auf die Validierungsmenge lässt leise Information in die Wahl einsickern."}}, {"correct": 0, "en": {"q": "Evaluating on held-out data assumes that:", "o": ["the test data comes from the same distribution as the training data.", "the test set is always larger in size than the training set that was used to fit the model.", "the model achieves an error of zero on the training data.", "the data being evaluated carries no labels at all."], "e": "If the world shifts, a clean test score can still mislead."}, "de": {"q": "Die Auswertung auf zurückgehaltenen Daten setzt voraus, dass:", "o": ["die Testdaten aus derselben Verteilung stammen wie die Trainingsdaten.", "die Testmenge stets größer ist als die Trainingsmenge, mit der das Modell angepasst wurde.", "das Modell auf den Trainingsdaten einen Fehler von null erreicht.", "die ausgewerteten Daten überhaupt keine Labels tragen."], "e": "Wenn sich die Welt verschiebt, kann ein sauberer Testwert dennoch in die Irre führen."}}, {"correct": 1, "en": {"q": "The core tension in choosing a train/test split is that:", "o": ["adding still more test data to the evaluation always makes the underlying model itself better too.", "more training data builds a better model, while more test data gives a more reliable estimate.", "the chosen split has no effect on either of the two.", "the training set and the test set have to be equal in size."], "e": "You are dividing a fixed budget between learning and measuring."}, "de": {"q": "Die zentrale Spannung bei der Wahl einer Trainings-/Test-Aufteilung ist, dass:", "o": ["noch mehr Testdaten in der Auswertung das zugrunde liegende Modell selbst stets ebenfalls besser machen.", "mehr Trainingsdaten ein besseres Modell ergeben, während mehr Testdaten eine zuverlässigere Schätzung liefern.", "die gewählte Aufteilung auf keines von beiden Einfluss hat.", "die Trainingsmenge und die Testmenge gleich groß sein müssen."], "e": "Du teilst ein festes Budget zwischen Lernen und Messen auf."}}, {"correct": 1, "en": {"q": "The cold-start problem in recommendation systems is:", "o": ["the recommendation system is slow to respond and load whenever it has only just started up.", "there is too little data on a new user or item to make good recommendations.", "the model has been given far too many features to handle.", "the server hosting the system has gone offline entirely."], "e": "No history means nothing to base a recommendation on."}, "de": {"q": "Das Kaltstartproblem in Empfehlungssystemen ist:", "o": ["das Empfehlungssystem reagiert und lädt langsam, sobald es gerade erst gestartet ist.", "es gibt zu wenig Daten zu einem neuen Nutzer oder Objekt, um gute Empfehlungen zu geben.", "dem Modell wurden viel zu viele Merkmale zur Verarbeitung gegeben.", "der Server, der das System hostet, ist vollständig offline gegangen."], "e": "Keine Historie heißt, es gibt nichts, worauf man eine Empfehlung stützen könnte."}}, {"correct": 0, "en": {"q": "Collaborative filtering recommends items based on:", "o": ["the behavior of users with similar tastes.", "the written text description attached to each item.", "a fixed collection of hand-written recommendation rules.", "the listed price of the item and nothing else."], "e": "Users who liked what you liked point toward what you might like next."}, "de": {"q": "Kollaboratives Filtern empfiehlt Objekte auf Basis:", "o": ["des Verhaltens von Nutzern mit ähnlichem Geschmack.", "der geschriebenen Textbeschreibung, die jedem Objekt anhängt.", "einer festen Sammlung handgeschriebener Empfehlungsregeln.", "des angegebenen Preises des Objekts und sonst nichts."], "e": "Nutzer, denen gefiel, was dir gefiel, weisen auf das hin, was dir als Nächstes gefallen könnte."}}, {"correct": 1, "en": {"q": "Content-based filtering recommends items by:", "o": ["copying whatever the most popular users happened to do.", "matching item features to a user’s past preferences.", "selecting items completely at random for each user.", "disregarding the individual user’s history altogether."], "e": "It compares item attributes rather than other users’ behavior."}, "de": {"q": "Inhaltsbasiertes Filtern empfiehlt Objekte, indem es:", "o": ["kopiert, was auch immer die beliebtesten Nutzer zufällig getan haben.", "Objektmerkmale mit den früheren Vorlieben eines Nutzers abgleicht.", "für jeden Nutzer Objekte völlig zufällig auswählt.", "die individuelle Historie des Nutzers vollständig außer Acht lässt."], "e": "Es vergleicht Objektattribute statt das Verhalten anderer Nutzer."}}, {"correct": 1, "en": {"q": "The Galton board (balls bouncing through pegs) illustrates how:", "o": ["recommendations end up being produced in an essentially random and unpredictable way.", "many small independent chances add up to a bell-shaped distribution.", "gradient descent finds the minimum of a loss surface.", "the entropy of a distribution is calculated in practice."], "e": "Repeated binary choices produce the binomial, which approaches the normal curve."}, "de": {"q": "Das Galtonbrett (Kugeln, die durch Stifte prallen) veranschaulicht, wie:", "o": ["Empfehlungen am Ende auf im Wesentlichen zufällige und unvorhersehbare Weise entstehen.", "viele kleine unabhängige Zufälle sich zu einer glockenförmigen Verteilung aufaddieren.", "der Gradientenabstieg das Minimum einer Verlustfläche findet.", "die Entropie einer Verteilung in der Praxis berechnet wird."], "e": "Wiederholte binäre Entscheidungen erzeugen die Binomialverteilung, die sich der Normalkurve annähert."}}, {"correct": 1, "en": {"q": "The “popularity trap” in recommendation systems refers to:", "o": ["items that were once popular gradually ending up removed from the catalog over time.", "popular items getting recommended more, which makes them more popular still.", "users developing a strong dislike for the most popular items.", "a software bug somewhere in the recommendation database."], "e": "A rich-get-richer loop. Early advantage compounds, and new items struggle."}, "de": {"q": "Die „Popularitätsfalle“ in Empfehlungssystemen bezeichnet:", "o": ["einst beliebte Objekte, die mit der Zeit allmählich aus dem Katalog entfernt werden.", "beliebte Objekte, die öfter empfohlen werden, was sie noch beliebter macht.", "Nutzer, die eine starke Abneigung gegen die beliebtesten Objekte entwickeln.", "einen Softwarefehler irgendwo in der Empfehlungsdatenbank."], "e": "Eine Schleife, in der die Reichen reicher werden. Frühe Vorteile häufen sich, und neue Objekte haben es schwer."}}, {"correct": 1, "en": {"q": "Conway’s Game of Life demonstrates that:", "o": ["complex behavior demands an equally complex set of rules.", "a few simple local rules can produce rich global patterns.", "cellular automata are incapable of carrying out computation.", "randomness is a prerequisite for any structure to emerge."], "e": "Emergence: complexity from simplicity, with no global blueprint."}, "de": {"q": "Conways Game of Life zeigt, dass:", "o": ["komplexes Verhalten einen ebenso komplexen Satz von Regeln erfordert.", "wenige einfache lokale Regeln reiche globale Muster erzeugen können.", "zelluläre Automaten unfähig sind, Berechnungen durchzuführen.", "Zufall eine Voraussetzung dafür ist, dass überhaupt Struktur entsteht."], "e": "Emergenz: Komplexität aus Einfachheit, ohne globalen Bauplan."}}, {"correct": 1, "en": {"q": "At a conceptual level, a neural network computes by:", "o": ["storing all of the training data and querying it later.", "composing layers of non-linear transformations.", "sorting the input features into a particular order.", "applying one single linear equation to the input."], "e": "Stacked layers with non-linearities let it represent complicated functions."}, "de": {"q": "Auf konzeptioneller Ebene rechnet ein neuronales Netz, indem es:", "o": ["alle Trainingsdaten speichert und sie später abfragt.", "Schichten nicht-linearer Transformationen verkettet.", "die Eingabemerkmale in eine bestimmte Reihenfolge sortiert.", "eine einzige lineare Gleichung auf die Eingabe anwendet."], "e": "Gestapelte Schichten mit Nichtlinearitäten lassen es komplizierte Funktionen darstellen."}}, {"correct": 1, "en": {"q": "Depth (more layers) helps a neural network because it:", "o": ["cuts down the total number of trainable parameters that the network needs in order to work.", "lets the network build features hierarchically, simpler ones combining into complex ones.", "removes the network’s dependence on having any training data.", "provides a guarantee that the network will never overfit."], "e": "Early layers catch edges, later layers catch shapes, and so on."}, "de": {"q": "Tiefe (mehr Schichten) hilft einem neuronalen Netz, weil sie:", "o": ["die Gesamtzahl der trainierbaren Parameter senkt, die das Netz zum Funktionieren braucht.", "das Netz Merkmale hierarchisch aufbauen lässt, wobei einfachere sich zu komplexen verbinden.", "die Abhängigkeit des Netzes von Trainingsdaten beseitigt.", "eine Garantie dafür bietet, dass das Netz nie überanpasst."], "e": "Frühe Schichten erfassen Kanten, spätere Schichten erfassen Formen und so weiter."}}, {"correct": 1, "en": {"q": "At its mechanical core, a large language model:", "o": ["looks the answer up in a stored database of facts.", "predicts the next token given the preceding text.", "follows a set of grammar rules written out by hand.", "runs the input through a single decision tree."], "e": "Trained to continue text, it generates one token at a time."}, "de": {"q": "In seinem mechanischen Kern tut ein großes Sprachmodell Folgendes:", "o": ["es schlägt die Antwort in einer gespeicherten Faktendatenbank nach.", "es sagt das nächste Token aus dem vorausgehenden Text vorher.", "es folgt einem Satz von Hand ausformulierter Grammatikregeln.", "es schickt die Eingabe durch einen einzelnen Entscheidungsbaum."], "e": "Darauf trainiert, Text fortzusetzen, erzeugt es ein Token nach dem anderen."}}, {"correct": 1, "en": {"q": "An LLM “hallucination” is:", "o": ["an image that the model has been asked to generate.", "a confident output that is factually wrong or invented.", "a failure occurring in the underlying hardware.", "a particular category of training data fed to it."], "e": "Fluent and plausible does not mean true. The model optimizes for likely text, not verified fact."}, "de": {"q": "Eine „Halluzination“ eines LLM ist:", "o": ["ein Bild, das das Modell erzeugen sollte.", "eine selbstbewusste Ausgabe, die sachlich falsch oder erfunden ist.", "ein Fehler, der in der zugrunde liegenden Hardware auftritt.", "eine bestimmte Kategorie von Trainingsdaten, die ihm zugeführt wird."], "e": "Flüssig und plausibel heißt nicht wahr. Das Modell optimiert auf wahrscheinlichen Text, nicht auf geprüfte Fakten."}}, {"correct": 1, "en": {"q": "Prompt engineering is best described as:", "o": ["retraining the underlying weights of the model from scratch.", "shaping the input to steer the model’s output toward what you want.", "directly editing the source code that the model runs on.", "attaching labels to the data used to train the model."], "e": "It controls the framing and instructions, not the underlying model."}, "de": {"q": "Prompt-Engineering lässt sich am besten beschreiben als:", "o": ["das Neutrainieren der zugrunde liegenden Gewichte des Modells von Grund auf.", "das Formen der Eingabe, um die Ausgabe des Modells in die gewünschte Richtung zu lenken.", "das direkte Bearbeiten des Quellcodes, auf dem das Modell läuft.", "das Anhängen von Labels an die Daten, mit denen das Modell trainiert wird."], "e": "Es steuert Rahmung und Anweisungen, nicht das zugrunde liegende Modell."}}, {"correct": 1, "en": {"q": "NIST benchmarks of face recognition systems have found that accuracy:", "o": ["stays identical across every demographic group that was tested.", "can vary across demographic groups, with higher error rates for some.", "reaches a perfect score whenever the lighting is good.", "depends on nothing more than the price of the camera."], "e": "Performance gaps across groups are a documented and consequential finding."}, "de": {"q": "NIST-Benchmarks von Gesichtserkennungssystemen haben ergeben, dass die Genauigkeit:", "o": ["über jede getestete demografische Gruppe hinweg identisch bleibt.", "über demografische Gruppen hinweg schwanken kann, mit höheren Fehlerraten für einige.", "einen perfekten Wert erreicht, wann immer die Beleuchtung gut ist.", "von nichts weiter abhängt als vom Preis der Kamera."], "e": "Leistungslücken zwischen Gruppen sind ein dokumentierter und folgenreicher Befund."}}, {"correct": 1, "en": {"q": "When a study says a medical AI “outperforms” doctors, the careful reader checks:", "o": ["only the single headline accuracy figure that happened to be reported in the abstract.", "how the evaluation was set up and whether it reflects real clinical use.", "the total number of parameters contained in the model.", "the brand name of the hardware the model was run on."], "e": "Lab performance on a curated dataset is not the same as performance in a clinic."}, "de": {"q": "Wenn eine Studie sagt, eine medizinische KI „übertreffe“ Ärzte, prüft die sorgfältige Leserin:", "o": ["nur die einzelne Schlagzeilen-Genauigkeitszahl, die zufällig im Abstract berichtet wurde.", "wie die Auswertung aufgebaut war und ob sie den echten klinischen Einsatz widerspiegelt.", "die Gesamtzahl der im Modell enthaltenen Parameter.", "den Markennamen der Hardware, auf der das Modell lief."], "e": "Laborleistung auf einem kuratierten Datensatz ist nicht dasselbe wie Leistung in einer Klinik."}}, {"correct": 1, "en": {"q": "A model trained on historically biased data will tend to:", "o": ["correct that bias on its own without any intervention.", "reproduce and sometimes amplify the bias in its predictions.", "ignore the patterns present in the data altogether.", "become more accurate specifically on minority groups."], "e": "The model learns the decisions encoded in the data, fair or not."}, "de": {"q": "Ein Modell, das auf historisch verzerrten Daten trainiert wurde, neigt dazu:", "o": ["diese Verzerrung von selbst ohne jedes Eingreifen zu korrigieren.", "die Verzerrung in seinen Vorhersagen zu reproduzieren und manchmal zu verstärken.", "die in den Daten vorhandenen Muster vollständig zu ignorieren.", "speziell bei Minderheitengruppen genauer zu werden."], "e": "Das Modell lernt die in den Daten kodierten Entscheidungen, ob fair oder nicht."}}, {"correct": 1, "en": {"q": "A hard fact about mathematical fairness definitions is that:", "o": ["there is a single agreed-upon definition that everyone uses.", "several reasonable definitions exist and cannot all hold at once.", "fairness is something that is always straightforward to guarantee.", "fairness and accuracy are guaranteed never to come into conflict."], "e": "Equal false positive rates and equal predictive value can be mutually exclusive."}, "de": {"q": "Eine harte Tatsache über mathematische Fairness-Definitionen ist, dass:", "o": ["es eine einzige vereinbarte Definition gibt, die alle verwenden.", "mehrere vernünftige Definitionen existieren und nicht alle zugleich gelten können.", "Fairness etwas ist, das sich stets unkompliziert garantieren lässt.", "Fairness und Genauigkeit garantiert nie in Konflikt geraten."], "e": "Gleiche Falsch-Positiv-Raten und gleicher Vorhersagewert können sich gegenseitig ausschließen."}}, {"correct": 1, "en": {"q": "Reading an AI system as a citizen rather than a user means asking:", "o": ["only whether the system is polished, enjoyable, and genuinely fun for people to use.", "what it optimizes for, whose interests that serves, and who can be harmed.", "only how fast the system manages to run in practice.", "only how much the system ends up costing to operate."], "e": "The optimization target and its incentives often matter more than the interface."}, "de": {"q": "Ein KI-System als Bürgerin statt als Nutzerin zu lesen, heißt zu fragen:", "o": ["nur, ob das System ausgereift, angenehm und wirklich vergnüglich zu benutzen ist.", "worauf es optimiert, wessen Interessen das dient und wer Schaden nehmen kann.", "nur, wie schnell das System in der Praxis läuft.", "nur, wie viel der Betrieb des Systems am Ende kostet."], "e": "Das Optimierungsziel und seine Anreize zählen oft mehr als die Oberfläche."}}, {"correct": 1, "en": {"q": "EU AI regulation is broadly organized around:", "o": ["an outright, blanket ban placed on essentially every form of machine learning there is.", "a risk-based approach, with stricter rules for higher-risk uses.", "the sheer size of the model and nothing else besides.", "the particular programming language used to build it."], "e": "Higher-stakes applications face stronger obligations."}, "de": {"q": "Die EU-KI-Regulierung ist im Großen und Ganzen organisiert um:", "o": ["ein striktes, pauschales Verbot, das auf praktisch jede Form des maschinellen Lernens gelegt wird.", "einen risikobasierten Ansatz, mit strengeren Regeln für Anwendungen höheren Risikos.", "die schiere Größe des Modells und sonst nichts.", "die konkrete Programmiersprache, mit der es gebaut wurde."], "e": "Anwendungen mit höherem Einsatz unterliegen stärkeren Pflichten."}}, {"correct": 1, "en": {"q": "To “map” an AI system (e.g. a streaming feed), a useful first step is to identify its:", "o": ["physical location of the data-center servers that the whole system happens to run on.", "likely ML type, training data, optimization target, and potential harms.", "font and the color scheme of its user interface.", "date on which the system was first released."], "e": "Naming the optimization target usually reveals why the system behaves as it does."}, "de": {"q": "Um ein KI-System (z. B. einen Streaming-Feed) zu „kartieren“, ist ein nützlicher erster Schritt, Folgendes zu bestimmen:", "o": ["den physischen Standort der Rechenzentrumsserver, auf denen das gesamte System zufällig läuft.", "den wahrscheinlichen ML-Typ, die Trainingsdaten, das Optimierungsziel und mögliche Schäden.", "die Schriftart und das Farbschema seiner Benutzeroberfläche.", "das Datum, an dem das System erstmals veröffentlicht wurde."], "e": "Das Optimierungsziel zu benennen, offenbart meist, warum sich das System so verhält."}}];

    hook:"The full question bank, and a fresh 20-question sample every time. One at a time.",
    iH:"Before you begin",
    iP1:"This is the full bank of " + MC.length + " multiple-choice questions for the course, one per topic across all twelve classes. The exam itself will draw a subset of these, so working through the whole bank is the surest preparation.",
    dl:"Download all " + MC.length + " questions (.md)",
    iM1:"Bank: " + MC.length + " questions", iM2:"This run: 20 sampled", iM3:"One correct answer each",
    iP2:"The practice test below picks 20 questions at random from the bank and shuffles the options. Click an option to lock it in and reveal the answer. Restart for a fresh set.",
    start:"Start the 20-question test", prev:"Back", next:"Next", finish:"See score",
    counter:n=>"Question " + n + " of " + SAMPLE,
    correctLabel:"Correct",
    rH:"Your score",
    verdict:(s)=> s===SAMPLE ? "All " + SAMPLE + " correct." : s + " of " + SAMPLE + " correct.",
    rNote:"This was a random subset for practice. The real exam draws a different selection. Restart for a fresh set of 20.",
    review:"Review answers", restart:"New 20 questions",
    foot:"AI Foundations \u00b7 Exam practice \u00b7 Source on GitHub."
  },
  de:{
    title:"Klausur-\u00dcbung",
    hook:"Der gesamte Fragenpool und jedes Mal eine frische Stichprobe aus 20 Fragen. Eine nach der anderen.",
    iH:"Bevor Sie beginnen",
    iP1:"Dies ist der vollst\u00e4ndige Pool von " + MC.length + " Multiple-Choice-Fragen f\u00fcr den Kurs, eine je Thema \u00fcber alle zw\u00f6lf Klassen hinweg. Die Klausur selbst zieht eine Teilmenge daraus, daher ist das Durcharbeiten des gesamten Pools die sicherste Vorbereitung.",
    dl:"Alle " + MC.length + " Fragen herunterladen (.md)",
    iM1:"Pool: " + MC.length + " Fragen", iM2:"Dieser Durchlauf: 20 gezogen", iM3:"Je eine richtige Antwort",
    iP2:"Der \u00dcbungstest unten w\u00e4hlt 20 Fragen zuf\u00e4llig aus dem Pool und mischt die Optionen. Klicken Sie eine Option an, um sie festzulegen und die Antwort aufzudecken. Neu starten f\u00fcr einen frischen Satz.",
    start:"Test mit 20 Fragen starten", prev:"Zur\u00fcck", next:"Weiter", finish:"Auswertung",
    counter:n=>"Frage " + n + " von " + SAMPLE,
    correctLabel:"Richtig",
    rH:"Ihr Ergebnis",
    verdict:(s)=> s===SAMPLE ? "Alle " + SAMPLE + " richtig." : s + " von " + SAMPLE + " richtig.",
    rNote:"Dies war eine zuf\u00e4llige Teilmenge zum \u00dcben. Die echte Klausur zieht eine andere Auswahl. Neu starten f\u00fcr einen frischen Satz von 20.",
    review:"Antworten ansehen", restart:"20 neue Fragen",
    foot:"KI Grundlagen \u00b7 Klausur-\u00dcbung \u00b7 Quellcode auf GitHub."
  }
};

let lang = "en";
let idx = 0;
let picks = [];                 // [{q, perm:[..], correctPos}]
let answers = [];               // chosen display position per pick, or null
const $ = id => document.getElementById(id);
const LET = ["a","b","c","d"];

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function sample(){
  const idxs = shuffle([...Array(MC.length).keys()]).slice(0, SAMPLE);
  picks = idxs.map(q=>{
    const perm = shuffle([0,1,2,3]);
    return { q, perm, correctPos: perm.indexOf(MC[q].correct) };
  });
  answers = new Array(SAMPLE).fill(null);
}

function toggleLang(){
  lang = lang === "en" ? "de" : "en";
  document.documentElement.lang = lang;
  document.querySelector(".lang-toggle").textContent = lang === "en" ? "DE" : "EN";
  paintStatic();
  if(!$("quiz").classList.contains("hidden")) render();
  if(!$("result").classList.contains("hidden")) showResult();
  typeset();
}

function paintStatic(){
  const t = T[lang];
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if(t[k]!==undefined && typeof t[k]==="string") el.textContent = t[k];
  });
  $("prev").textContent = t.prev;
  $("r-review").textContent = t.review;
  $("r-restart").textContent = t.restart;
  $("foot").textContent = t.foot;
}

function start(){
  sample();
  $("intro").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  idx = 0; render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function render(){
  const t = T[lang];
  $("prog").style.width = (idx/SAMPLE*100) + "%";
  $("prev").disabled = idx===0;
  renderMC(idx);
  $("next").textContent = (idx === SAMPLE-1) ? t.finish : t.next;
  typeset();
}

function renderMC(i){
  const t = T[lang], pk = picks[i], d = MC[pk.q][lang];
  const done = answers[i]!==null;
  $("counter").textContent = t.counter(i+1);
  let html = `<div class="qtag">${t.counter(i+1)}</div><div class="qtext">${d.q}</div>`;
  pk.perm.forEach((origK, pos)=>{
    let cls = "opt";
    if(done){ cls += " locked";
      if(pos===pk.correctPos) cls += " correct";
      else if(pos===answers[i]) cls += " wrong";
      else cls += " dim";
    }
    html += `<button class="${cls}" onclick="pick(${i},${pos})"><span class="mark">${LET[pos]}</span><span>${d.o[origK]}</span></button>`;
  });
  html += `<div class="explain${done?' show':''}"><span class="tag">${t.correctLabel}: ${LET[pk.correctPos]}</span>${d.e}</div>`;
  $("card").innerHTML = html;
  $("next").disabled = !done;
}

function pick(i,pos){
  if(answers[i]!==null) return;
  answers[i] = pos;
  renderMC(i); typeset();
}

function go(dir){
  if(dir>0 && idx===SAMPLE-1){ finish(); return; }
  idx = Math.max(0, Math.min(SAMPLE-1, idx+dir));
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function finish(){
  $("prog").style.width = "100%";
  $("quiz").classList.add("hidden");
  showResult();
}

function showResult(){
  const t = T[lang];
  const score = answers.reduce((s,a,i)=> s + (a===picks[i].correctPos?1:0), 0);
  $("result").classList.remove("hidden");
  $("r-h").textContent = t.rH;
  $("r-score").textContent = score;
  $("r-of").textContent = "/" + SAMPLE;
  $("r-verdict").textContent = t.verdict(score);
  $("r-note").textContent = t.rNote;
}

function review(){
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  idx = 0; render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function restart(){
  $("result").classList.add("hidden");
  $("quiz").classList.add("hidden");
  $("intro").classList.remove("hidden");
  $("prog").style.width = "0%";
  window.scrollTo({top:0,behavior:"smooth"});
}

function typeset(){
  if(window.renderMathInElement){
    renderMathInElement(document.body,{
      delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],
      throwOnError:false
    });
  }
}

window.addEventListener("load",()=>{ paintStatic(); typeset(); });
</script>
</body>
</html>
