<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Animal Guesser</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background-color:#141420; color:#e8e8f0; font-family:'Georgia','Times New Roman',serif; line-height:1.8; font-size:18px; }
  .container { max-width:820px; margin:0 auto; padding:0 24px; }
  a { color:#80b4f0; } a:hover { text-decoration:underline; }

  .lang-toggle { position:fixed; top:16px; right:16px; background:#2a2a44; border:1px solid #4a4a70; border-radius:20px; padding:6px 14px; cursor:pointer; font-size:13px; font-family:sans-serif; color:#a0a0d0; z-index:100; transition:background .2s; }
  .lang-toggle:hover { background:#363658; }

  .hero { text-align:center; padding:80px 24px 36px; }
  .tags { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:28px; }
  .tag { background:#1c1c2e; color:#8888b0; border:1px solid #2a2a40; border-radius:20px; padding:4px 12px; font-size:12px; font-family:sans-serif; letter-spacing:.3px; }
  .hero h1 { font-size:42px; font-weight:700; color:#fff; line-height:1.3; max-width:700px; margin:0 auto 28px; }
  .hero-quote { max-width:600px; margin:0 auto 32px; color:#a0a0c0; font-style:italic; font-size:21px; line-height:1.6; }

  section { padding:30px 0; }

  .btn { font-family:sans-serif; font-size:15px; cursor:pointer; background:#2a2a44; border:1px solid #4a4a70; border-radius:6px; padding:11px 24px; color:#a0a0d0; transition:background .2s; }
  .btn:hover { background:#363658; }
  .btn-ghost { background:transparent; border:1px solid #2a2a40; color:#777; }
  .btn-ghost:hover { background:transparent; border-color:#4a4a70; color:#aaa; }

  .counter { font-family:sans-serif; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:#6a6a90; margin-bottom:16px; }
  .qcard { background:#1c1c2e; border:1px solid #2a2a40; border-radius:10px; padding:34px 30px; margin-bottom:24px; min-height:120px; display:flex; align-items:center; position:relative; }
  .qcard::before { content:"?"; position:absolute; top:-18px; left:22px; font-size:40px; font-weight:700; color:#6060a0; background:#141420; padding:0 8px; line-height:1; }
  .qtext { font-size:27px; color:#fff; line-height:1.35; }
  .answers { display:flex; gap:14px; flex-wrap:wrap; }
  .ans { flex:1; min-width:140px; font-family:sans-serif; font-size:17px; cursor:pointer; padding:16px; border-radius:8px; transition:background .2s, border-color .2s; }
  .ans.yes { background:#2a2a44; border:1px solid #6060a0; color:#d8d8f4; }
  .ans.yes:hover { background:#363658; }
  .ans.no { background:transparent; border:1px solid #34344e; color:#9a9ac0; }
  .ans.no:hover { border-color:#6060a0; color:#c8c8e8; }

  .guess-emoji { font-size:84px; line-height:1; margin:4px 0; text-align:center; }
  .guess-q { font-size:34px; color:#a88ef0; font-style:italic; text-align:center; margin-bottom:6px; }
  .guess-sub { color:#fff; text-align:center; margin-bottom:4px; font-size:22px; }
  .guess-tiny { color:#888; font-style:italic; text-align:center; margin-bottom:26px; font-size:15px; font-family:sans-serif; }

  .reveal-head { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:8px; }
  .reveal-head h2 { font-size:30px; color:#fff; line-height:1.3; }
  .verdict { font-family:sans-serif; font-size:12px; letter-spacing:1px; text-transform:uppercase; padding:4px 12px; border-radius:20px; }
  .verdict.win { color:#80b4f0; border:1px solid #3a5a85; }
  .verdict.miss { color:#a88ef0; border:1px solid #5a4a85; }
  .reveal-caption { color:#a0a0c0; font-style:italic; font-size:17px; line-height:1.7; margin-bottom:22px; max-width:660px; }

  .treewrap { background:#1c1c2e; border:1px solid #2a2a40; border-radius:10px; overflow-x:auto; padding:14px; margin-bottom:14px; }
  svg { display:block; }
  .hint { font-family:sans-serif; font-size:12px; color:#555; margin-bottom:26px; }

  .path-panel h3 { font-family:sans-serif; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#7070a0; margin-bottom:14px; }
  .pathgrid { display:grid; grid-template-columns:1fr; gap:11px 24px; }
  @media(min-width:640px){ .pathgrid{ grid-template-columns:1fr 1fr; } }
  .step { padding-left:14px; border-left:2px solid #2a2a40; }
  .step .sq { font-size:15px; color:#ccc; line-height:1.4; }
  .step .sa { font-family:sans-serif; font-size:12px; letter-spacing:.5px; text-transform:uppercase; }
  .step .sa.yes { color:#80b4f0; } .step .sa.no { color:#a88ef0; }
  .step.leaf { border-left-color:#6060a0; } .step.leaf .sq { color:#c4b6f4; }

  .actions { margin-top:30px; display:flex; gap:12px; flex-wrap:wrap; }

  details { background:#1c1c2e; border:1px solid #2a2a40; border-radius:8px; padding:14px 20px; margin-top:40px; }
  details summary { cursor:pointer; color:#8080c0; font-size:14px; font-family:sans-serif; user-select:none; list-style:none; }
  details summary::before { content:"\25B8  "; }
  details[open] summary::before { content:"\25BE  "; }
  details[open] summary { margin-bottom:10px; }
  details p { font-size:15px; color:#999; margin-bottom:14px; line-height:1.7; }
  details p:last-child { margin-bottom:0; }

  footer { text-align:center; padding:48px 24px; color:#444; font-size:14px; }
  footer a { color:#555; }

  .edge { stroke:#34344e; stroke-width:1.2; fill:none; }
  .edge.hot { stroke:#a88ef0; stroke-width:3; }
  .elabel { font-family:sans-serif; font-size:8px; fill:#5a5a7a; }
  .node-dot { fill:#2a2a44; stroke:#4a4a70; stroke-width:1.2; }
  .node-dot.hot { fill:#a88ef0; stroke:#a88ef0; }
  .leaf-emoji { font-size:15px; text-anchor:middle; dominant-baseline:central; }
  .leaf-label { font-family:sans-serif; font-size:8px; text-anchor:end; fill:#6a6a90; }
  .leaf-label.hot { fill:#c4b6f4; font-weight:700; }
  .leaf-ring { fill:none; stroke:#a88ef0; stroke-width:2.5; }

  @media (max-width:680px){ .hero h1{ font-size:28px; } .qtext{ font-size:22px; } .guess-sub{ font-size:18px; } }
</style>
</head>
<body>

<div class="lang-toggle" id="langToggle" onclick="toggleLang()">DE</div>

<div class="container">

  <header class="hero">
    <div class="tags">
      <span class="tag">all</span><span class="tag">no-code</span><span class="tag">~20 min</span>
      <span class="tag">mini-module</span><span class="tag">try-without-ai</span>
      <span class="tag">trees-and-forests</span><span class="tag">classification</span>
    </div>
    <h1 data-i18n="heroTitle"></h1>
    <p class="hero-quote" data-i18n="heroQuote"></p>
  </header>

  <section id="intro">
    <div style="text-align:center;">
      <button class="btn" onclick="start()" data-i18n="startBtn"></button>
      <p style="color:#666; font-size:14px; font-family:sans-serif; margin-top:18px;" data-i18n="introNote"></p>
    </div>
  </section>

  <section id="question" style="display:none;">
    <p class="counter" id="counter"></p>
    <div class="qcard"><span class="qtext" id="qtext"></span></div>
    <div class="answers">
      <button class="ans yes" onclick="answer(true)" data-i18n="yes"></button>
      <button class="ans no" onclick="answer(false)" data-i18n="no"></button>
    </div>
  </section>

  <section id="guess" style="display:none;">
    <div class="guess-emoji" id="gEmoji"></div>
    <p class="guess-q" id="gName"></p>
    <p class="guess-sub" data-i18n="guessAsk"></p>
    <p class="guess-tiny" data-i18n="guessSub"></p>
    <div class="answers">
      <button class="ans yes" onclick="reveal(true)" data-i18n="guessYes"></button>
      <button class="ans no" onclick="reveal(false)" data-i18n="guessNo"></button>
    </div>
  </section>

  <section id="revealScreen" style="display:none;">
    <div class="reveal-head">
      <h2 data-i18n="revealTitle"></h2>
      <span id="verdict" class="verdict"></span>
    </div>
    <p class="reveal-caption" id="revealCaption"></p>
    <div class="treewrap"><div id="svgHolder"></div></div>
    <p class="hint" data-i18n="hint"></p>
    <div class="path-panel">
      <h3 data-i18n="routeTitle"></h3>
      <div class="pathgrid" id="pathList"></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="start()" data-i18n="playAgain"></button>
      <button class="btn btn-ghost" onclick="goIntro()" data-i18n="backStart"></button>
    </div>
    <details>
      <summary data-i18n="ddSummary"></summary>
      <p data-i18n="ddP1"></p>
      <p data-i18n="ddP2"></p>
    </details>
  </section>

  <footer>
    <span data-i18n="footnote"></span><br><br>
    <a href="https://github.com/i-yam/passt/tree/main/modules/akinator" data-i18n="srcLink"></a> &nbsp;·&nbsp; <a href="../../">overfit &amp; chill</a>
  </footer>

</div>

<script>
/* ---------- the tree ----------
   Q(id, question EN, question DE, yes-branch, no-branch)
   A(id, name EN, name DE, emoji)                     -> a leaf
   100 leaves. Order of questions chosen by hand (on purpose: see footnote). */
const Q=(id,q,qDe,yes,no)=>({id,q,qDe,yes,no});
const A=(id,animal,de,emoji)=>({id,animal,de,emoji});

/* ===== birds (20) ===== */
const BIRDS =
Q("b_fly","Can it fly?","Kann es fliegen?",
  Q("b_water","Does it spend most of its time on or beside water? (a water bird)","Verbringt es die meiste Zeit auf dem Wasser oder am Ufer? (ein Wasservogel)",
    Q("b_pink","Is it pink and stands on one leg?","Ist es rosa und steht auf einem Bein?",
      A("flamingo","Flamingo","Flamingo","🦩"),
      Q("b_swan","Is it white, with a long curved neck?","Ist es weiß, mit einem langen, gebogenen Hals?",
        A("swan","Swan","Schwan","🦢"),
        Q("b_stork","Does it have very long legs and nest on rooftops?","Hat es sehr lange Beine und nistet auf Dächern?",
          A("stork","Stork","Storch","🐦"),
          Q("b_gull","Is it a grey-and-white seabird that screeches and steals chips?","Ist es ein grau-weißer Seevogel, der kreischt und Pommes klaut?",
            A("seagull","Seagull","Möwe","🐦"),
            Q("b_quack","Does it quack?","Schnattert es?",
              A("duck","Duck","Ente","🦆"),
              A("goose","Goose","Gans","🪿")))))),
    Q("b_prey","Is it a bird of prey with sharp talons?","Ist es ein Greifvogel mit scharfen Krallen?",
      Q("b_night","Is it active at night, with big round eyes?","Ist es nachtaktiv und hat große runde Augen?",
        A("owl","Owl","Eule","🦉"),
        A("eagle","Eagle","Adler","🦅")),
      Q("b_colour","Does it have strikingly colourful plumage?","Hat es auffällig buntes Gefieder?",
        Q("b_fan","Does it have a huge fan-shaped tail with eye spots?","Hat es einen großen, fächerförmigen Schwanz mit Augenflecken?",
          A("peacock","Peacock","Pfau","🦚"),
          Q("b_hover","Is it tiny and hovers in place while drinking nectar?","Ist es winzig und schwebt beim Nektartrinken auf der Stelle?",
            A("hummingbird","Hummingbird","Kolibri","🐦"),
            A("parrot","Parrot","Papagei","🦜"))),
        Q("b_black","Is it all black and caws?","Ist es ganz schwarz und krächzt?",
          A("crow","Crow","Krähe","🐦‍⬛"),
          Q("b_drum","Does it hammer holes into tree trunks with its beak?","Hämmert es mit dem Schnabel Löcher in Baumstämme?",
            A("woodpecker","Woodpecker","Specht","🐦"),
            Q("b_red","Is it small with a red-orange breast?","Ist es klein und hat eine rot-orange Brust?",
              A("robin","Robin","Rotkehlchen","🐦"),
              Q("b_sparrow","Is it a small, plain brown bird that chirps in gardens and cities?","Ist es ein kleiner, schlichter brauner Vogel, der in Gärten und Städten zwitschert?",
                A("sparrow","Sparrow","Spatz","🐦"),
                A("pigeon","Pigeon","Taube","🕊️")))))))),
  Q("b_cold","Does it live in icy places and swim?","Lebt es in eisigen Gegenden und schwimmt?",
    A("penguin","Penguin","Pinguin","🐧"),
    Q("b_tall","Is it very tall, fast, and the largest bird alive?","Ist es sehr groß, schnell und der größte lebende Vogel?",
      A("ostrich","Ostrich","Strauß","🐦"),
      Q("b_turkey","Is it a big farm bird with a red wattle, roasted for holidays?","Ist es ein großer Hofvogel mit rotem Kehllappen, der zu Feiertagen gebraten wird?",
        A("turkey","Turkey","Truthahn","🦃"),
        A("chicken","Chicken","Huhn","🐔")))));

/* ===== water creatures (17) ===== */
const WATER =
Q("aq_mammal","Is it a mammal? (breathes air, warm-blooded)","Ist es ein Säugetier? (atmet Luft, warmblütig)",
  Q("aq_bigcar","Is it bigger than a car?","Ist es größer als ein Auto?",
    A("whale","Whale","Wal","🐋"),
    Q("aq_fur","Does it have fur?","Hat es Fell?",
      Q("aq_river","Does it live in rivers, float on its back and crack shellfish on its belly?","Lebt es in Flüssen, treibt auf dem Rücken und knackt Muscheln auf dem Bauch?",
        A("otter","Otter","Otter","🦦"),
        A("seal","Seal","Robbe","🦭")),
      A("dolphin","Dolphin","Delfin","🐬"))),
  Q("aq_fish","Does it have fins and a backbone? (is it a fish)","Hat es Flossen und ein Rückgrat? (ist es ein Fisch)",
    Q("aq_pred","Is it a large predator with rows of sharp teeth?","Ist es ein großer Räuber mit Reihen scharfer Zähne?",
      A("shark","Shark","Hai","🦈"),
      Q("aq_snake","Is it long and snake-like?","Ist es lang und schlangenförmig?",
        A("eel","Eel","Aal","🐍"),
        Q("aq_horse","Is it tiny, swims upright, and has a head like a horse?","Ist es winzig, schwimmt aufrecht und hat einen Kopf wie ein Pferd?",
          A("seahorse","Seahorse","Seepferdchen","🐠"),
          Q("aq_clown","Is it orange with white stripes?","Ist es orange mit weißen Streifen?",
            A("clownfish","Clownfish","Clownfisch","🐠"),
            Q("aq_salmon","Does it have pink flesh and swim up rivers to spawn?","Hat es rosa Fleisch und schwimmt zum Laichen Flüsse hinauf?",
              A("salmon","Salmon","Lachs","🐟"),
              A("goldfish","Goldfish","Goldfisch","🐟")))))),
    Q("aq_shell","Does it have a hard shell and claws? (a crustacean)","Hat es einen harten Panzer und Scheren? (ein Krebstier)",
      Q("aq_lobster","Is it large, with two big claws and a long body?","Ist es groß, mit zwei großen Scheren und einem langen Körper?",
        A("lobster","Lobster","Hummer","🦞"),
        Q("aq_shrimp","Is it small and curved, and turns pink when cooked?","Ist es klein und gebogen und wird beim Kochen rosa?",
          A("shrimp","Shrimp","Garnele","🦐"),
          A("crab","Crab","Krabbe","🦀"))),
      Q("aq_arms","Does it have eight arms and change colour?","Hat es acht Arme und kann die Farbe wechseln?",
        A("octopus","Octopus","Oktopus","🐙"),
        Q("aq_ten","Does it have a long tube-shaped body and ten arms?","Hat es einen langen, röhrenförmigen Körper und zehn Arme?",
          A("squid","Squid","Tintenfisch","🦑"),
          Q("aq_star","Is it star-shaped, with five arms, and sits on rocks?","Ist es sternförmig, mit fünf Armen, und sitzt auf Felsen?",
            A("starfish","Starfish","Seestern","⭐"),
            A("jellyfish","Jellyfish","Qualle","🪼")))))));

/* ===== creepy-crawlies (15) ===== */
const BUGS =
Q("g_legs","Does it have legs?","Hat es Beine?",
  Q("g_eight","Does it have eight legs?","Hat es acht Beine?",
    Q("g_sting_tail","Does it have pincers and a curled tail with a stinger?","Hat es Scheren und einen gekrümmten Schwanz mit Stachel?",
      A("scorpion","Scorpion","Skorpion","🦂"),
      A("spider","Spider","Spinne","🕷️")),
    Q("g_wings","Does it have large wings, bigger than its body?","Hat es große Flügel, größer als sein Körper?",
      Q("g_night","Does it fly at night and circle around lamps?","Fliegt es nachts und kreist um Lampen?",
        A("moth","Moth","Motte","🦋"),
        A("butterfly","Butterfly","Schmetterling","🦋")),
      Q("g_sting","Does it sting?","Sticht es?",
        Q("g_honey","Is it fuzzy and makes honey?","Ist es pelzig und macht Honig?",
          A("bee","Bee","Biene","🐝"),
          A("wasp","Wasp","Wespe","🐝")),
        Q("g_fly","Can it fly?","Kann es fliegen?",
          Q("g_blood","Does it whine in your ear and drink blood?","Surrt es dir ins Ohr und saugt Blut?",
            A("mosquito","Mosquito","Mücke","🦟"),
            Q("g_dome","Is it a small red dome with black spots?","Ist es eine kleine rote Kuppel mit schwarzen Punkten?",
              A("ladybug","Ladybug","Marienkäfer","🐞"),
              Q("g_hard","Does it have hard, shiny wing cases on its back?","Hat es harte, glänzende Flügeldecken auf dem Rücken?",
                A("beetle","Beetle","Käfer","🪲"),
                A("fly","Fly","Fliege","🪰")))),
          Q("g_hop","Does it jump with big back legs and chirp?","Springt es mit großen Hinterbeinen und zirpt?",
            A("grasshopper","Grasshopper","Grashüpfer","🦗"),
            Q("g_roach","Is it brown and flat, scurries around kitchens, and is hard to kill?","Ist es braun und flach, huscht durch Küchen und ist schwer totzukriegen?",
              A("cockroach","Cockroach","Kakerlake","🪳"),
              A("ant","Ant","Ameise","🐜"))))))),
  Q("g_shell","Does it carry a spiral shell on its back?","Trägt es ein spiralförmiges Haus auf dem Rücken?",
    A("snail","Snail","Schnecke","🐌"),
    A("worm","Worm","Wurm","🪱")));

/* ===== mammals (42) ===== */
const DOMESTIC =
Q("d_big","Is it livestock-sized, bigger than a large dog?","Hat es Nutztiergröße, größer als ein großer Hund?",
  Q("d_wool","Does it have a thick, woolly coat?","Hat es ein dichtes, wolliges Fell?",
    A("sheep","Sheep","Schaf","🐑"),
    Q("d_horns","Does it have horns and a beard, and like to climb?","Hat es Hörner und einen Bart und klettert gern?",
      A("goat","Goat","Ziege","🐐"),
      Q("d_snout","Is it pink, with a flat snout and a curly tail?","Ist es rosa, mit flacher Schnauze und Ringelschwanz?",
        A("pig","Pig","Schwein","🐖"),
        Q("d_moo","Does it give milk and say moo?","Gibt es Milch und macht „muh“?",
          A("cow","Cow","Kuh","🐄"),
          Q("d_mane","Is it a tall riding animal with a flowing mane?","Ist es ein großes Reittier mit wallender Mähne?",
            A("horse","Horse","Pferd","🐎"),

  Q("d_cage","Is it a small rodent kept in a cage?","Ist es ein kleines Nagetier, das im Käfig gehalten wird?",
    Q("d_notail","Is it chubby, with no tail, and squeaks loudly?","Ist es pummelig, ohne Schwanz, und quiekt laut?",
      A("guineapig","Guinea pig","Meerschweinchen","🐹"),
      A("hamster","Hamster","Hamster","🐹")),
    Q("d_bark","Does it bark?","Bellt es?",
      A("dog","Dog","Hund","🐕"),
      Q("d_meow","Does it purr or meow?","Schnurrt oder miaut es?",
        A("cat","Cat","Katze","🐈"),
        A("rabbit","Rabbit","Kaninchen","🐇")))));

const SMALL_WILD =
Q("sw_spines","Does it have spines?","Hat es Stacheln?",
  A("hedgehog","Hedgehog","Igel","🦔"),
  Q("sw_tail","Does it have a big bushy tail and climb trees?","Hat es einen großen buschigen Schwanz und klettert auf Bäume?",
    A("squirrel","Squirrel","Eichhörnchen","🐿️"),
    Q("sw_dam","Does it have a flat paddle tail and build dams?","Hat es einen flachen Paddelschwanz und baut Dämme?",
      A("beaver","Beaver","Biber","🦫"),
      Q("sw_mask","Does it have a black mask across its eyes and raid rubbish bins?","Hat es eine schwarze Maske über den Augen und plündert Mülltonnen?",

        Q("sw_stink","Is it black with a white stripe, and sprays a terrible smell?","Ist es schwarz mit weißem Streifen und versprüht einen furchtbaren Gestank?",
          A("skunk","Skunk","Stinktier","🦨"),
          Q("sw_rat","Is it bigger than your fist, with a long bald tail?","Ist es größer als deine Faust, mit langem nacktem Schwanz?",
            A("rat","Rat","Ratte","🐀"),
            A("mouse","Mouse","Maus","🐁")))))));

const BIG_WILD =
Q("w_cat","Is it a big cat? (a feline predator)","Ist es eine Großkatze? (ein katzenartiger Räuber)",
  Q("c_mane","Do the males grow a mane?","Tragen die Männchen eine Mähne?",
    A("lion","Lion","Löwe","🦁"),
    Q("c_stripes","Does it have stripes?","Hat es Streifen?",
      A("tiger","Tiger","Tiger","🐅"),
      Q("c_speed","Is it built for speed, with tear-mark lines down its face?","Ist es auf Schnelligkeit gebaut, mit Tränenstreifen im Gesicht?",
        A("cheetah","Cheetah","Gepard","🐆"),
        A("leopard","Leopard","Leopard","🐆")))),
  Q("w_bear","Is it a bear?","Ist es ein Bär?",
    Q("be_panda","Is it black and white, and eats bamboo?","Ist es schwarz-weiß und frisst Bambus?",
      A("panda","Panda","Panda","🐼"),
      A("bear","Bear","Bär","🐻")),
    Q("w_moose","Does it have huge flat, palm-shaped antlers and a drooping nose?","Hat es riesige flache, schaufelförmige Geweihe und eine hängende Nase?",
      A("moose","Moose","Elch","🫎"),
      Q("w_mega","Is it bigger and heavier than a horse?","Ist es größer und schwerer als ein Pferd?",
        Q("p_trunk","Does it have a long trunk?","Hat es einen langen Rüssel?",

const MAMMALS =

const REPTILES =

const TREE =
Q("q_feathers","Does it have feathers? (is it a bird)","Hat es Federn? (ist es ein Vogel)",
  BIRDS,
  Q("q_water","Does it live mostly in the water? (a fish, or a sea creature like an octopus, a whale or a seal)","Lebt es hauptsächlich im Wasser? (ein Fisch oder ein Meerestier wie ein Oktopus, ein Wal oder eine Robbe)",

/* ---------- layout ---------- */
let _leaf=0, _maxDepth=0;
(function layout(n,d){ n.depth=d; if(d>_maxDepth)_maxDepth=d;
  if(n.animal){ n.gx=_leaf++; return; }
  layout(n.yes,d+1); layout(n.no,d+1); n.gx=(n.yes.gx+n.no.gx)/2;
})(TREE,0);
const LEAVES=_leaf;
const PAD=34, GAP=33, YG=48, LABELROOM=62;
const W = PAD*2 + (LEAVES-1)*GAP;
const H = PAD + _maxDepth*YG + LABELROOM;
const px=n=>PAD + n.gx*GAP, py=n=>PAD + n.depth*YG;

/* ---------- lang ---------- */
let lang='en';
const tr=k=>T[lang][k].replace(/\{n\}/g,LEAVES);
const qOf=n=>lang==='de'?n.qDe:n.q;
const nameOf=n=>lang==='de'?n.de:n.animal;
function applyStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.innerHTML = tr(el.getAttribute('data-i18n')); });
}
function toggleLang(){
  lang = (lang==='en')?'de':'en';
  document.documentElement.lang = lang;
  document.getElementById('langToggle').textContent = (lang==='en')?'DE':'EN';
  applyStatic();
  rerenderDynamic();
}

/* ---------- state ---------- */
let cur, step, path, lastCorrect=null, screen='intro';
const $=id=>document.getElementById(id);
const SCREENS=['intro','question','guess','revealScreen'];
function show(id){ screen=id; SCREENS.forEach(s=>$(s).style.display=(s===id?'block':'none')); window.scrollTo(0,0); }
function goIntro(){ show('intro'); }
function start(){ cur=TREE; step=1; path=[]; lastCorrect=null; show('question'); renderQ(); }
function renderQ(){ $('counter').textContent=tr('questionWord')+' '+step; $('qtext').textContent=qOf(cur); }
function answer(yes){ path.push({node:cur, ans:yes}); cur=yes?cur.yes:cur.no; if(cur.animal){ showGuess(); } else { step++; renderQ(); } }
function showGuess(){ $('gEmoji').textContent=cur.emoji; $('gName').textContent=nameOf(cur); show('guess'); }


/* ---------- reveal ---------- */
function reveal(correct){ lastCorrect=correct; show('revealScreen'); renderReveal(); }
function renderReveal(){
  const ids=new Set(path.map(p=>p.node.id)); ids.add(cur.id);
  const hot=new Set();
  for(const p of path){ const child=p.ans?p.node.yes:p.node.no; hot.add(p.node.id+'>'+child.id); }
  drawTree(ids,hot,cur.id);
  drawPath();
  const v=$('verdict');
  if(lastCorrect){ v.textContent=tr('verdictWin'); v.className='verdict win'; }
  else{ v.textContent=tr('verdictMiss'); v.className='verdict miss'; }
  $('revealCaption').textContent = lastCorrect?tr('captionWin'):tr('captionMiss');
}
function drawTree(ids,hot,leafId){
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  (function edges(n){ if(n.animal) return;
    for(const [k,c] of [['yes',n.yes],['no',n.no]]){
      const h=hot.has(n.id+'>'+c.id), x1=px(n),y1=py(n),x2=px(c),y2=py(c);
      s+='<path class="edge'+(h?' hot':'')+'" d="M'+x1+','+y1+' L'+x2+','+y2+'"/>';
      const yl = (k==='yes')?tr('yesShort')[0]:tr('noShort')[0];
      s+='<text class="elabel" x="'+((x1+x2)/2 + (k==='yes'?-6:6))+'" y="'+((y1+y2)/2-2)+'">'+yl+'</text>';
      edges(c);
    } })(TREE);
  (function nodes(n){ const x=px(n),y=py(n),h=ids.has(n.id);
    if(n.animal){
      if(n.id===leafId) s+='<circle class="leaf-ring" cx="'+x+'" cy="'+y+'" r="13"/>';
      s+='<text class="leaf-emoji" x="'+x+'" y="'+y+'">'+n.emoji+'</text>';
      s+='<text class="leaf-label'+(h?' hot':'')+'" x="'+x+'" y="'+(y+13)+'" transform="rotate(-52 '+x+' '+(y+13)+')">'+nameOf(n)+'</text>';
    } else {
      s+='<circle class="node-dot'+(h?' hot':'')+'" cx="'+x+'" cy="'+y+'" r="5"><title>'+qOf(n).replace(/"/g,'')+'</title></circle>';
      nodes(n.yes); nodes(n.no);
    } })(TREE);
  s+='</svg>'; $('svgHolder').innerHTML=s;
}
function drawPath(){
  let h='';
  path.forEach((p,i)=>{
    h+='<div class="step"><div class="sq">'+(i+1)+'. '+qOf(p.node)+'</div><div class="sa '+(p.ans?'yes':'no')+'">&rarr; '+(p.ans?tr('yesShort'):tr('noShort'))+'</div></div>';
  });
  h+='<div class="step leaf"><div class="sq">'+cur.emoji+' '+tr('leafWord')+': '+nameOf(cur)+'</div></div>';
  $('pathList').innerHTML=h;
}

/* re-render whatever screen is showing, in the new language */
function rerenderDynamic(){
  if(screen==='question') renderQ();
  else if(screen==='guess') showGuess();
  else if(screen==='revealScreen') renderReveal();
}

/* init */
applyStatic();
</script>
